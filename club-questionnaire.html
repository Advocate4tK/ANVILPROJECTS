<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Club Setup — Referee Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family:'DM Sans',sans-serif; background:#f0ece6; color:#1f2328;
        line-height:1.5; padding:20px 16px 60px;
    }
    .wrap { max-width:860px; margin:0 auto; }

    /* ⭐ THE LOGO MARK — lifted VERBATIM from unsubscribe.html, which took it
       from logo-preview.html. Tod, 2026-10-21: "we should have our referee tool
       red and yellow card icon on this as well. That's standard."
       ⛔ Never redraw it by hand. The master lives in logo-preview.html and
       every page that needs it copies that, so they cannot drift apart. */
.logo-mark { --sz: 65px; position: relative; width: var(--sz); height: var(--sz); flex-shrink: 0; margin: 0 auto 20px; }
        .lcard { position: absolute; border-radius: calc(var(--sz) * 0.065); }
        .lcard-red {
            width: calc(var(--sz)*0.58); height: calc(var(--sz)*0.82);
            background: linear-gradient(145deg,#f87171 0%,#ef4444 55%,#b91c1c 100%);
            box-shadow: 0 calc(var(--sz)*0.02) calc(var(--sz)*0.12) rgba(239,68,68,0.45);
            top: calc(var(--sz)*0.21); left: calc(var(--sz)*0.32); transform: rotate(22deg);
        }
        .lcard-yellow {
            width: calc(var(--sz)*0.64); height: calc(var(--sz)*0.88);
            background: linear-gradient(145deg,#fde047 0%,#f59e0b 55%,#b45309 100%);
            box-shadow: 0 0 calc(var(--sz)*0.2) rgba(245,158,11,0.6), 0 0 calc(var(--sz)*0.4) rgba(245,158,11,0.2), 0 calc(var(--sz)*0.05) calc(var(--sz)*0.18) rgba(0,0,0,0.5);
            top: calc(var(--sz)*0.12); left: calc(var(--sz)*0.18); transform: rotate(10deg);
        }
        .lcard-yellow::before {
            content:''; position:absolute; top:8%; left:10%; width:14%; height:52%;
            background:linear-gradient(180deg,rgba(255,255,255,0.38) 0%,rgba(255,255,255,0) 100%); border-radius:3px;
        }
        .logo-text {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; padding-top:calc(var(--sz)*0.10);
            font-family:'Barlow Condensed',sans-serif; font-weight:800;
            text-transform:uppercase; text-align:center; z-index:10; line-height:0.88; letter-spacing:2px;
        }
        .logo-line1 { color:#fff; font-size:calc(var(--sz)*0.2); text-shadow:0 2px 12px rgba(0,0,0,0.95),0 0 24px rgba(0,0,0,0.7); }
        .logo-line2 { color:#00c853; font-size:calc(var(--sz)*0.32); text-shadow:0 2px 12px rgba(0,0,0,0.95),0 0 28px rgba(0,200,83,0.5); margin-top:calc(var(--sz)*-0.01); transform:skewX(-14deg); display:block; }
        .logo-underline { display:block; height:calc(var(--sz)*0.022); width:calc(var(--sz)*0.58); margin-top:calc(var(--sz)*0.025); background:#ef4444; border-radius:calc(var(--sz)*0.01); box-shadow:0 0 calc(var(--sz)*0.012) #ef4444,0 0 calc(var(--sz)*0.04) rgba(239,68,68,0.85),0 0 calc(var(--sz)*0.08) rgba(239,68,68,0.5); transform:skewX(-14deg); }

    /* —— header —— */
    .hdr {
        background:#060e20; color:#fff; border-radius:14px;
        padding:24px 28px; margin-bottom:18px;
    }
    .brand {
        font-family:'Barlow Condensed',sans-serif; font-size:1.5rem; font-weight:800;
        text-transform:uppercase; letter-spacing:1.2px;
    }
    .brand span { color:#00c853; }
    .hdr h1 {
        font-family:'Barlow Condensed',sans-serif; font-size:2rem; font-weight:800;
        text-transform:uppercase; letter-spacing:0.8px; margin-top:10px; line-height:1.1;
    }
    .hdr p { color:#b9c2d0; font-size:0.9rem; margin-top:8px; }

    /* ── progress ─────────────────────────────────────────────────────── */
    .prog {
        background:#fff; border-radius:12px; padding:14px 20px; margin-bottom:18px;
        box-shadow:0 4px 15px rgba(0,0,0,0.07); position:sticky; top:12px; z-index:20;
    }
    .prog-bar { height:8px; background:#e8e2da; border-radius:5px; overflow:hidden; margin-bottom:8px; }
    .prog-fill { height:100%; background:#00c853; width:0; transition:width 0.3s; }
    .prog-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .prog-txt { font-size:0.84rem; font-weight:700; color:#1f2328; }
    .saved { font-size:0.84rem; color:#3f3a33; font-family:'JetBrains Mono',monospace; }

    /* ── sections ─────────────────────────────────────────────────────── */
    .sec {
        background:#fff; border-radius:12px; margin-bottom:16px;
        box-shadow:0 4px 15px rgba(0,0,0,0.07); overflow:hidden;
        border-left:5px solid #e2d9ce;
    }
    .sec.done { border-left-color:#00c853; }
    .sec-hd {
        display:flex; align-items:center; gap:12px; padding:16px 22px; cursor:pointer;
        background:#fff; user-select:none;
    }
    .sec-hd:hover { background:#faf8f5; }
    .sec-n {
        width:28px; height:28px; border-radius:50%; background:#060e20; color:#fff;
        display:flex; align-items:center; justify-content:center; flex-shrink:0;
        font-weight:800; font-size:0.82rem;
    }
    .sec.done .sec-n { background:#00c853; color:#06210f; }
    .sec-t {
        font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; font-weight:800;
        text-transform:uppercase; letter-spacing:0.7px; color:#09142a; flex:1;
    }
    .req { font-size:0.68rem; font-weight:800; color:#b45309; background:#fef3c7;
           border-radius:4px; padding:2px 7px; letter-spacing:0.5px; }
    /* ⭐ REQUIRED SHOWN ON THE FIELD, not just the section. Tod, 2026-10-21:
       "the sections that I asked to be mandatory need to be updated... payment
       coordinator for instance." The header said NEEDED while four contact
       blocks sat underneath with nothing saying which of them had to be filled. */
    .must { color:#dc2626; font-weight:800; margin-left:3px; }
    .reqpill { font-size:0.66rem; font-weight:800; color:#b45309; background:#fef3c7;
               border-radius:4px; padding:2px 7px; letter-spacing:0.5px; text-transform:uppercase; }
    .done-pill { font-size:0.66rem; font-weight:800; color:#0b7a3b; background:#dcfce7;
                 border-radius:4px; padding:2px 7px; letter-spacing:0.5px; text-transform:uppercase; }
    .chev { color:#3f3a33; font-size:0.9rem; transition:transform 0.2s; }
    .sec.open .chev { transform:rotate(90deg); }
    .sec-bd { display:none; padding:4px 22px 22px; border-top:1px solid #f0ece6; }
    .sec.open .sec-bd { display:block; }
    .sec-help { font-size:0.84rem; color:#3f3a33; margin:14px 0 16px; }

    /* ── fields ───────────────────────────────────────────────────────── */
    label.lbl {
        display:block; font-size:0.85rem; font-weight:700; color:#3f3a33;
        text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;
    }
    /* ⚠️ A field has to LOOK like a field. #dde3f0 on #fff is about 1.3:1
       against the white card behind it — Tod, on the Command Center version of
       the same mistake: "the pick one drop down is white against white." */
    input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea {
        width:100%; padding:9px 11px; border:1.5px solid #a2978a; border-radius:7px;
        font-family:'DM Sans',sans-serif; font-size:0.9rem; background:#fffcf7; color:#1f2328;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:#00c853; background:#fff; }
    input[readonly] { background:#f0ece6; color:#4a443c; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    @media (max-width:640px) { .grid3, .grid2 { grid-template-columns:1fr; } }

    .block {
        border:1px solid #e8e2da; border-radius:9px; padding:14px 16px; margin-bottom:12px;
        background:#faf8f5;
    }
    .block-t {
        font-family:'Barlow Condensed',sans-serif; font-size:0.9rem; font-weight:800;
        text-transform:uppercase; letter-spacing:0.7px; color:#09142a; margin-bottom:10px;
        display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .pill {
        font-size:0.66rem; font-weight:800; letter-spacing:0.5px; border-radius:4px;
        padding:2px 7px; background:#e0edff; color:#1d4ed8;
    }
    .tick { display:flex; align-items:center; gap:7px; font-size:0.84rem; font-weight:600; cursor:pointer; }
    .tick input { width:16px; height:16px; cursor:pointer; accent-color:#00c853; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip {
        border:1.5px solid #dde3f0; background:#fff; border-radius:20px; padding:7px 14px;
        font-size:0.82rem; font-weight:700; cursor:pointer; font-family:inherit; color:#1f2328;
    }
    .chip.on { border-color:#060e20; background:#060e20; color:#fff; }

    .btn {
        background:#060e20; color:#fff; border:none; border-radius:8px; padding:10px 22px;
        font-family:'DM Sans',sans-serif; font-weight:800; font-size:0.88rem; cursor:pointer;
    }
    .btn:hover { background:#102a4d; }
    .btn.gr { background:#00c853; color:#06210f; }
    .btn.sm { padding:6px 13px; font-size:0.85rem; font-weight:700; }
    .btn.gh { background:#fff; border:1.5px solid #dde3f0; color:#1f2328; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-x {
        background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:6px;
        padding:6px 9px; cursor:pointer; font-weight:700; font-size:0.82rem;
    }

    table.rates { width:100%; border-collapse:collapse; font-size:0.86rem; }
    table.rates th {
        font-family:'Barlow Condensed',sans-serif; font-size:0.76rem; font-weight:800;
        text-transform:uppercase; letter-spacing:0.6px; color:#3f3a33;
        text-align:left; padding:6px 8px; border-bottom:1.5px solid #e8e2da;
    }
    table.rates td { padding:5px 8px; border-bottom:1px solid #f0ece6; }
    table.rates input { padding:6px 8px; font-size:0.85rem; text-align:center; }
    .money { position:relative; }
    .money::before {
        content:'$'; position:absolute; left:7px; top:50%; transform:translateY(-50%);
        color:#4a443c; font-size:0.82rem; pointer-events:none;
    }
    .money input { padding-left:17px; text-align:left; }

    .sec-foot {
        display:flex; align-items:center; justify-content:space-between; gap:12px;
        flex-wrap:wrap; margin-top:18px; padding-top:14px; border-top:1px dashed #e2d9ce;
    }
    .note {
        background:#f0f9ff; border:1px solid #bae6fd; border-left:4px solid #0369a1;
        border-radius:7px; padding:10px 13px; font-size:0.82rem; color:#0c4a6e; margin-bottom:14px;
    }
    .warn {
        background:#fffbeb; border:1px solid #fde68a; border-left:4px solid #f59e0b;
        border-radius:7px; padding:10px 13px; font-size:0.82rem; color:#78350f; margin-bottom:14px;
    }
    .foot { text-align:center; color:#3f3a33; font-size:0.84rem; margin-top:26px; }
    .foot b { color:#09142a; }
    .center-msg { background:#fff; border-radius:12px; padding:46px 28px; text-align:center; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
    <div class="center-msg"><p style="color:#3f3a33;">Loading…</p></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// CLUB SETUP QUESTIONNAIRE
// 2026-10-15
//
// WHY THIS EXISTS
//   Tod: "I'm begging people for information and going back and forth.
//   Referee Tool is about streamlining getting data from people." Onboarding a
//   club meant a Google Sheet with six headings on it — Contacts, Venues, Age
//   Groups, Referee Pay, Crew Rules, Billing — and a club would answer the
//   easy one and stop. Portland, Valley and Haddam-Killingworth are all sitting
//   in the Command Center with contacts filled in and nothing else.
//
//   Headings are not questions. This asks the questions.
//
// WHO FILLS IT IN
//   Whoever has the answers. Tod spins off a link, sends it to Eric; Eric
//   fills what he knows and forwards the same link to the club president, who
//   finishes it. ⚠️ So every keystroke saves SERVER-SIDE, not in the browser —
//   two people on one link only works if the second one sees the first one's
//   answers.
//
// ⚠️ THE TOKEN IS THE CREDENTIAL. There is no login, deliberately. The page
//   can only ever reach its own row, through two SECURITY DEFINER functions
//   that take the token — it has no rights on the table itself.
//
// ⛔ IT WRITES NOTHING REAL. Answers land in club_questionnaires and stay
//   there until Tod promotes them. A club president's typo must not silently
//   become the rate a referee gets paid.
//
// ⛔ BILLING IS NOT ON THIS PAGE. Tod: "that's what I charge them — my
//   contract, not intake." Asking a club to fill in your pricing puts your
//   pricing in their hands.
// ═══════════════════════════════════════════════════════════════════════════

// ⛔ ONLY `t` IS READ. The link also carries ?c=<club-slug> so a human can
// tell three of these apart in an email draft, but it is a LABEL and nothing
// here may ever consult it — the moment a name decides what loads, guessing
// slugs becomes a way to read other clubs' submissions.
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let A = {};              // the answers, as they stand
let DONE = new Set();    // sections marked complete
let META = null;         // entity_kind / entity_name / status
let LEAGUES = [];
let POOL = [];           // every venue in Referee Tool, with its fields
let _saveTimer = null, _saving = false, _dirty = false;

// ── sections ────────────────────────────────────────────────────────────────
// ⭐ ORDER MATTERS. Age Groups sits before Pay and Crew because both are
// GENERATED from it — you can't be asked a U12 centre rate before you've said
// you run U12. That is the thing a spreadsheet structurally cannot do, and
// it's the whole reason this is a page.
const SECTIONS = [
    { key:'contacts',  title:'Who to contact',     req:true  },
    { key:'leagues',   title:'Leagues & districts', req:true },
    { key:'venues',    title:'Venues & fields',     req:true },
    { key:'ages',      title:'Age groups',          req:true },
    { key:'pay',       title:'Referee pay',         req:true },
    { key:'crew',      title:'Crew rules',          req:true },
    { key:'policy',    title:'Paying referees',     req:true },
    { key:'portals',   title:'Pages you want',      req:false },
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// ── boot ────────────────────────────────────────────────────────────────────
(async function boot() {
    const wrap = document.getElementById('wrap');
    if (!TOKEN) return bail('This link is missing its code. Ask whoever sent it for the full link.');
    try {
        const { data, error } = await sb.rpc('questionnaire_get', { p_token: TOKEN });
        if (error) throw new Error(error.message);
        const row = Array.isArray(data) ? data[0] : data;
        if (!row) return bail('This link has expired, or the setup has already been completed. Ask for a fresh one.');
        META  = row;
        A     = row.answers || {};
        DONE  = new Set(row.sections_done || []);
        // ⚠️ RE-CHECK EVERY TICK ON LOAD. A section marked complete under an
        // older, looser rule stays complete forever otherwise. Eric ticked
        // Stonington's venues when the form let him add a blank row; the row
        // was later cleaned out of the database and his claim survived both —
        // the page still said "All sections done" with no venues at all.
        //
        // ⭐ This also means tightening a rule re-tests old answers instead of
        // grandfathering them in.
        const _stale = [...DONE].filter(k => sectionGap(k));
        if (_stale.length) {
            _stale.forEach(k => DONE.delete(k));
            // Saved straight away so Tod's review agrees with what they see.
            _dirty = true;
        }
        try {
            const { data: lg } = await sb.from('leagues').select('name').order('name');
            LEAGUES = (lg || []).map(l => l.name).filter(Boolean);
        } catch (e) { console.warn('league list unavailable', e); }
        // ⭐ THE WHOLE VENUE POOL. Tod, 2026-10-15: "the FORM doesn't allow you
        // to pick from ALL the venues we have in REFEREE TOOL... should have a
        // drop down that allows you to pull and select from our pool."
        // Clubs share sites constantly — a high school is one venue whoever is
        // playing on it — and a typed name that doesn't match ours fails on the
        // Central Assign export weeks later.
        try {
            const [{ data: vs }, { data: fs }] = await Promise.all([
                sb.from('venues').select('id,"Venue Name","Venue ID",address,city,state').order('"Venue Name"'),
                sb.from('fields').select('"Field Name","Venue ID"'),
            ]);
            const byVid = {};
            (fs || []).forEach(f => { (byVid[f['Venue ID']] ||= []).push(f['Field Name'] || ''); });
            POOL = (vs || []).map(v => ({
                id: v.id, name: v['Venue Name'] || '', addr: v.address || '', town: v.city || '',
                fields: (byVid[v['Venue ID']] || []).filter(Boolean),
            })).filter(v => v.name);
        } catch (e) { console.warn('venue pool unavailable', e); }
        render();
        if (_dirty) save();
    } catch (e) {
        bail('Could not open this form: ' + e.message);
    }
    function bail(msg) {
        wrap.innerHTML = `<div class="hdr"><div style="display:flex; align-items:center; gap:14px;">
                <div class="logo-mark" style="--sz:54px; margin:0;">
                    <div class="lcard lcard-red"></div><div class="lcard lcard-yellow"></div>
                    <div class="logo-text"><span class="logo-line1">Referee</span><span class="logo-line2">Tool</span><span class="logo-underline"></span></div>
                </div><div class="brand">REFEREE <span>TOOL</span></div></div></div>
            <div class="center-msg">
                <p style="font-size:1rem; color:#1f2328; font-weight:600;">${esc(msg)}</p>
                <p class="foot" style="margin-top:18px;">Referee Tool by <b>Anvil Arts</b></p>
            </div>`;
    }
})();

// ── saving ──────────────────────────────────────────────────────────────────
// ⚠️ Debounced, not on every keypress — but ALWAYS flushed before the tab
// closes. Somebody typing three venues and closing the laptop must not lose
// them; that is exactly the abandonment this page exists to stop.
function touch() {
    _dirty = true;
    setSaved('Saving…');
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(save, 900);
}

async function save(submit = false) {
    if (_saving) return;
    _saving = true;
    try {
        const { data, error } = await sb.rpc('questionnaire_save', {
            p_token: TOKEN, p_answers: A, p_done: [...DONE], p_submit: !!submit,
        });
        if (error) throw new Error(error.message);
        if (data === false) throw new Error('this form is no longer accepting changes');
        _dirty = false;
        setSaved('Saved ' + new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }));
        return true;
    } catch (e) {
        setSaved('⚠ Not saved — ' + e.message, true);
        return false;
    } finally { _saving = false; }
}

function setSaved(txt, bad) {
    const el = document.getElementById('savedAt');
    if (el) { el.textContent = txt; el.style.color = bad ? '#b91c1c' : '#3f3a33'; }
}

// A last-chance flush. Can't await in beforeunload, so it's fire-and-hope —
// but combined with the 900ms debounce it closes nearly the whole window.
window.addEventListener('beforeunload', e => {
    if (!_dirty) return;
    save();
    e.preventDefault();
    e.returnValue = '';
});

// ── shell ───────────────────────────────────────────────────────────────────
function render() {
    const submitted = META.status === 'submitted';
    document.getElementById('wrap').innerHTML = `
        <div class="hdr">
            <div style="display:flex; align-items:center; gap:14px;">
                <div class="logo-mark" style="--sz:54px; margin:0;">
                    <div class="lcard lcard-red"></div>
                    <div class="lcard lcard-yellow"></div>
                    <div class="logo-text">
                        <span class="logo-line1">Referee</span>
                        <span class="logo-line2">Tool</span>
                        <span class="logo-underline"></span>
                    </div>
                </div>
                <div class="brand">REFEREE <span>TOOL</span></div>
            </div>
            <h1>${esc(META.entity_name)} — Setup</h1>
            <p>Everything we need to get your games assigned. It saves as you go, so you can stop
               and come back, or pass this same link to somebody else to finish.</p>
        </div>
        <div class="prog">
            <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
            <div class="prog-row">
                <span class="prog-txt" id="progTxt"></span>
                <span style="font-size:0.8rem; color:#3f3a33; margin-left:auto;"><span class="must">*</span> must be filled in</span>
                <span class="saved" id="savedAt">Saved</span>
            </div>
        </div>
        ${submitted ? `<div class="note"><b>Sent in.</b> You can still change anything below and it
            will be picked up — nothing is locked until we've set the club up.</div>` : ''}
        <div id="secs"></div>
        <div style="background:#fff; border-radius:12px; padding:20px 24px; box-shadow:0 4px 15px rgba(0,0,0,0.07); margin-top:16px;">
            <div style="font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; font-weight:800; text-transform:uppercase; letter-spacing:0.7px; color:#09142a; margin-bottom:6px;">Finished?</div>
            <p style="font-size:0.84rem; color:#3f3a33; margin-bottom:14px;" id="submitHelp"></p>
            <button class="btn gr" id="submitBtn" onclick="submitAll()">Send it in →</button>
            <div id="submitMsg" style="margin-top:12px; font-size:0.86rem; font-weight:600;"></div>
        </div>
        <p class="foot">Referee Tool by <b>Anvil Arts</b> · this link is private to ${esc(META.entity_name)}</p>`;

    document.getElementById('secs').innerHTML = SECTIONS.map((s, i) => `
        <div class="sec ${DONE.has(s.key) ? 'done' : ''}" id="sec-${s.key}">
            <div class="sec-hd" onclick="toggleSec('${s.key}')">
                <div class="sec-n">${DONE.has(s.key) ? '✓' : i + 1}</div>
                <div class="sec-t">${s.title}</div>
                ${s.req && !DONE.has(s.key) ? '<span class="req">NEEDED</span>' : ''}
                <span class="chev">›</span>
            </div>
            <div class="sec-bd" id="bd-${s.key}"></div>
        </div>`).join('');

    SECTIONS.forEach(s => paint(s.key));
    // Open the first unfinished one so nobody lands on a wall of closed boxes.
    const first = SECTIONS.find(s => !DONE.has(s.key));
    if (first) toggleSec(first.key, true);
    updateProgress();
}

function toggleSec(key, force) {
    const el = document.getElementById('sec-' + key);
    const open = el.classList.contains('open');
    if (force && open) return;
    el.classList.toggle('open', force ? true : !open);
}

function updateProgress() {
    const req  = SECTIONS.filter(s => s.req);
    const got  = req.filter(s => DONE.has(s.key)).length;
    const pct  = Math.round(got / req.length * 100);
    const fill = document.getElementById('progFill');
    const txt  = document.getElementById('progTxt');
    if (fill) fill.style.width = pct + '%';
    if (txt)  txt.textContent = got === req.length
        ? 'All sections done — send it in below.'
        : `${got} of ${req.length} sections done`;
    const help = document.getElementById('submitHelp');
    if (help) {
        const left = req.filter(s => !DONE.has(s.key)).map(s => s.title);
        help.innerHTML = left.length
            ? `Still to do: <b>${left.map(esc).join(' · ')}</b>. You can send it in anyway and we'll
               follow up on the rest — but the more that's filled in, the faster you're live.`
            : `Everything's filled in. Send it over and we'll build it out.`;
    }
}

// ⚠️ "COMPLETE" WAS A CLAIM, NOT A CHECK. Eric ticked Venues on Stonington's
// form with one entirely blank venue row in it, and the page then told Tod
// "All sections done — send it in below." It reported a club as fully answered
// while carrying nothing. That is worse than asking badly: it is asserting
// something untrue.
//
// ⛔ These check for EMPTINESS, not correctness. Nobody gets blocked for an
// unusual answer — one AR, a venue with no fields, a blank AR rate — because
// those are all real and the form must not argue with a club about its own
// arrangements.
function sectionGap(key) {
    const empty = o => !o || !String(o).trim();
    switch (key) {
        case 'contacts': {
            // ⭐ ALL FOUR ARE MANDATORY. Tod, 2026-10-21: "contact info is key...
            // they must put in payment coordinator, club president, scheduling
            // contact and assignor as mandatory fields."
            //
            // Each one has a job nobody else can do:
            //   president  — signs the season contract, reads the audit page
            //   admin      — submits the games and asks for changes (a LOGIN)
            //   payment    — the only person who can pay a referee (a LOGIN)
            //   assignor   — who actually puts referees on their games
            //
            // ⚠️ Asked one at a time, in that order, so the message names the
            // one thing missing instead of "fill in your contacts".
            // ⚠️ "Same as president" makes one person holding three roles three
            // clicks rather than three retypings — that is what keeps this from
            // being onerous for a small club.
            const c = getVal('contacts', {});
            const want = [
                ['president', 'the club president or athletic director'],
                ['admin',     'the scheduling contact — they are the one who submits your games'],
                ['payment',   'the payment coordinator — nobody else can pay your referees'],
                ['assignor',  'who assigns your referees'],
            ];
            for (const [k, label] of want) {
                if (empty(c[k]?.name))  return label;
                if (empty(c[k]?.email)) return `an email for ${k === 'assignor' ? 'your assignor' : label.split(' — ')[0]}`;
            }
            return null;
        }
        case 'leagues': {
            // ⭐ A MAIN ONE IS REQUIRED, not just a list. Tod, 2026-10-21: "they
            // must provide a main district... make it mandatory that they
            // provide one as their main."
            //
            // ⚠️ A club with no primary is what produced the CT Cup mislabel —
            // with nothing marked main, whatever sat first in the list got
            // treated as the league, and games came out labelled wrong.
            //
            // ⛔ It is never inferred from order. One picked league auto-sets
            // itself as main (there is no ambiguity); two or more must be
            // chosen deliberately.
            const list = getVal('leagues.list', []);
            const free = getVal('leagues.freetext');
            if (!list.length && empty(free)) return 'at least one league or district';
            // The typed fallback only appears when our league list failed to
            // load, so there is no dropdown to pick a main from. Accept it and
            // sort it out at our end rather than trapping them.
            if (!list.length) return null;
            if (empty(getVal('leagues.primary'))) return 'which league is your main one';
            return null;
        }
        case 'venues':
            return getVal('venues.list', []).length ? null : 'at least one venue';
        case 'ages':
            return getVal('ages.list', []).some(a => !empty(a.name)) ? null : 'at least one age group';
        case 'pay': {
            const ags = getVal('ages.list', []).filter(a => !empty(a.name));
            if (!ags.length) return 'your age groups first';
            // ⭐ A MISSING HALF HAS TO BE DECLARED. No rec age groups and no tick
            // saying they don't run rec is an unanswered question, not an answer.
            if (!ags.some(a => a.type !== 'comp') && !getVal('pay.no_rec'))
                return 'your Rec rates — or tick that you don\'t run any Rec games';
            if (!ags.some(a => a.type === 'comp') && !getVal('pay.no_comp'))
                return 'your Comp/Travel rates — or tick that you don\'t run any Comp/Travel games';
            // Only the centre rate is required — AR and solo are legitimately
            // blank when a club doesn't use them.
            const miss = ags.filter((a, i) => empty(getVal('pay.' + ageKey(a, i) + '.center')));
            return miss.length ? `a centre rate for ${miss.map(ageLabel).join(', ')}` : null;
        }
        case 'crew': {
            const ags = getVal('ages.list', []).filter(a => !empty(a.name));
            if (!ags.length) return 'your age groups first';
            const miss = ags.filter((a, i) => empty(getVal('crew.' + ageKey(a, i))));
            return miss.length ? `how many officials for ${miss.map(ageLabel).join(', ')}` : null;
        }
        case 'policy':
            return getVal('policy.methods', []).length ? null : 'how you pay referees';
        default:
            return null;   // portals is genuinely optional — two unticked boxes is an answer
    }
}

// Mark a section complete / not complete.
function markDone(key, on) {
    if (on) {
        const gap = sectionGap(key);
        if (gap) {
            const box = document.querySelector(`#sec-${key} .sec-foot input[type=checkbox]`);
            if (box) box.checked = false;
            const foot = document.querySelector(`#sec-${key} .sec-foot`);
            let w = document.getElementById('gap-' + key);
            if (!w) {
                w = document.createElement('div');
                w.id = 'gap-' + key;
                w.className = 'warn';
                w.style.cssText = 'width:100%; margin:10px 0 0;';
                foot.appendChild(w);
            }
            w.innerHTML = `Still needs <b>${esc(gap)}</b> before this counts as done. Leave it unticked and send it anyway if you can't answer it — we'll follow up.`;
            return;
        }
        const w = document.getElementById('gap-' + key);
        if (w) w.remove();
    }
    markDoneReal(key, on);
}

function markDoneReal(key, on) {
    if (on) DONE.add(key); else DONE.delete(key);
    document.getElementById('sec-' + key).classList.toggle('done', on);
    const n = document.getElementById('sec-' + key).querySelector('.sec-n');
    const i = SECTIONS.findIndex(s => s.key === key);
    n.textContent = on ? '✓' : i + 1;
    const badge = document.getElementById('sec-' + key).querySelector('.req');
    if (badge) badge.style.display = on ? 'none' : '';
    updateProgress();
    touch();
    // Completing one section opens the next unfinished one — momentum, and
    // nobody has to hunt for where they were.
    if (on) {
        const next = SECTIONS.find(s => !DONE.has(s.key));
        if (next && next.key !== key) {
            document.getElementById('sec-' + key).classList.remove('open');
            toggleSec(next.key, true);
            document.getElementById('sec-' + next.key).scrollIntoView({ behavior:'smooth', block:'start' });
        }
    }
}

function secFoot(key) {
    return `<div class="sec-foot">
        <label class="tick"><input type="checkbox" ${DONE.has(key) ? 'checked' : ''}
            onchange="markDone('${key}', this.checked)"> This section is complete</label>
        <span style="font-size:0.84rem; color:#3f3a33;">Saves automatically</span>
    </div>`;
}

// ── generic binding ─────────────────────────────────────────────────────────
// Every input writes straight into A at a dotted path. One helper instead of
// forty handlers, and it means the saved shape and the rendered shape can't
// drift apart.
function setVal(path, v) {
    const bits = path.split('.');
    let o = A;
    for (let i = 0; i < bits.length - 1; i++) o = (o[bits[i]] ??= {});
    o[bits[bits.length - 1]] = v;
    touch();
}
function getVal(path, dflt = '') {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), A) ?? dflt;
}
function fld(path, label, ph = '', type = 'text', required = false) {
    // A red asterisk on the label, and the box itself outlined while it is
    // empty — so a required field that has not been filled is visible without
    // reading anything.
    const empty = String(getVal(path) || '').trim() === '';
    const mark  = required ? '<span class="must">*</span>' : '';
    const ring  = required && empty ? ' style="border-color:#dc2626;"' : '';
    return `<div><label class="lbl">${label}${mark}</label>
        <input type="${type}"${ring} placeholder="${esc(ph)}" value="${esc(getVal(path))}"
               oninput="setVal('${path}', this.value); markRequired(this, ${required});"></div>`;
}

// Clears the red ring the moment something is typed, without a full repaint
// that would steal focus mid-word.
function markRequired(el, required) {
    if (!required) return;
    el.style.borderColor = el.value.trim() === '' ? '#dc2626' : '';
}

function paint(key) { ({ contacts:pContacts, leagues:pLeagues, venues:pVenues, ages:pAges,
    pay:pPay, crew:pCrew, policy:pPolicy, portals:pPortals }[key])(); }

// ── 1 · contacts ────────────────────────────────────────────────────────────

    document.getElementById('bd-contacts').innerHTML = `
        <p class="sec-help"><b>All four are needed — name and email on each.</b> One person can hold more than one — plenty of

                    })()}

                        <input type="checkbox" ${getVal('contacts.' + r.k + '.same') ? 'checked' : ''}
                               onchange="sameAsPres('${r.k}', this.checked)"> same as the first contact</label>` : ''}
                </div>
                <p style="font-size:0.85rem; color:#3f3a33; margin-bottom:10px;">${r.hint}</p>
                <div class="grid3" id="c-${r.k}">
                    ${fld('contacts.' + r.k + '.name',  'Name',  'Jane Smith', 'text', true)}
                    ${fld('contacts.' + r.k + '.email', 'Email', 'jane@club.org', 'email', true)}

function sameAsPres(k, on) {

// ── 2 · leagues ─────────────────────────────────────────────────────────────
// ⚠️ MULTI-SELECT WITH ONE PRIMARY, and it must come off the known list, never

function pLeagues() {
    const picked  = getVal('leagues.list', []);

    document.getElementById('bd-leagues').innerHTML = `

function toggleLeague(n) {

//
// Tod, 2026-10-20: "I don't even want them to have the ability to create a new
// venue. That would break our system." And: "I don't want them being able to
// create fields on existing venues."
//
// ⚠️ WHY IT MATTERS: Central Assign owns venue and field NAMES, and our
// records mirror CA verbatim. A club typing "Stonington MS" where CA says
// "Stonington Middle School" produces a record that is rejected on export weeks
// later, by which point nobody remembers where it came from. A field is not a
// club's to invent either — it is a physical thing already catalogued from CA.
//
// The first version of this section let them type a new venue, type field names
// and sizes, and ✕ away both. Those deletes only touched their own submission,
// never the real tables — but it read as though it did, and it would have
// carried into anything promoted. It should never have been built that way; the
// CA-owns-the-names rule was known before a line of it was written.
//
// So: tick the venues we already hold, tick which of that venue's known fields
// they use. Anything missing goes in the notes as a message to Tod, who adds it
// properly in the Command Center where the CA name can be checked.
// ⛔ SELECTION ONLY. NOTHING HERE CREATES, EDITS OR DELETES A VENUE OR A FIELD.
//
// Tod, 2026-10-20: "I don't even want them to have the ability to create a new
// venue. That would break our system." And: "I don't want them being able to
// create fields on existing venues."
//
// ⚠️ Central Assign owns venue and field NAMES and our records mirror CA
// verbatim. A club typing "Stonington MS" where CA says "Stonington Middle
// School" produces a record rejected on export weeks later. A field is not a
// club's to invent either — it is a physical thing already catalogued from CA.
//
// ⚠️ AND IT IS A SHORT LIST, NOT THE WHOLE STATE. The first lockdown drew a

// we hold. Nothing typed, nothing invented.
// ⛔ ADD ONLY. NOTHING HERE CREATES, EDITS OR DELETES A VENUE OR A FIELD.
//
// Tod, 2026-10-20, three times over: "I don't even want them to have the
// ability to create a new venue. That would break our system." · "I don't want
// them being able to create fields on existing venues." · "I don't want you to
// give them an option to remove fields."
//
// ⚠️ Central Assign owns venue and field NAMES and our records mirror CA

//

function pVenues() {

function addChosenVenue() {
    const sel = document.getElementById('venuePick');
    const id  = Number(sel?.value);
    if (!id) { sel?.focus(); return; }
    const p = POOL.find(x => x.id === id);
    if (!p) return;
    const list = [...getVal('venues.list', [])];
    if (list.some(v => v.venue_id === id)) return;
    // ⚠️ Fields come straight from our own record, whole. The club is saying
    // "we play here", not choosing which parts of it exist.
    list.push({ venue_id: p.id, name: p.name, addr: p.addr, town: p.town,
                fields: p.fields.map(n => ({ name: n })) });
    setVal('venues.list', list);
    pVenues();
}

                </select></td>
            <td><select onchange="setAge(${i},'half',this.value)">
                    <option value="">— pick —</option>
                    ${['20','25','30','35','40','45'].map(h => `<option value="${h}" ${String(a.half) === h ? 'selected' : ''}>${h} min</option>`).join('')}
                </select></td>
            <td><button class="btn-x" onclick="delAge(${i})">✕</button></td>
        </tr>`).join('')}</tbody></table>` : `<p style="color:#3f3a33; font-size:0.86rem;">Nothing added yet — tap an age above, or add a row.</p>`}
        <button class="btn gh sm" style="margin-top:12px;" onclick="addAge()">+ Add a row</button>
        ${secFoot('ages')}`;
}
function ageList() { return [...getVal('ages.list', [])]; }
function quickAge(n) { const a = ageList(); a.push({ name:n, type:'rec', format:'', half:'' }); setVal('ages.list', a); pAges(); repaintDerived(); }
function addAge()    { const a = ageList(); a.push({ name:'', type:'rec', format:'', half:'' }); setVal('ages.list', a); pAges(); repaintDerived(); }
function delAge(i)   { const a = ageList(); a.splice(i, 1); setVal('ages.list', a); pAges(); repaintDerived(); }
function setAge(i, k, v) {
    const a = ageList(); a[i] = { ...a[i], [k]: v }; setVal('ages.list', a);
    // Renaming an age group has to carry through to the pay and crew tables,
    // or somebody fills in rates against a row that no longer exists.
    if (k === 'name' || k === 'type') repaintDerived();
}
function repaintDerived() { pPay(); pCrew(); }
function ageKey(a, i) { return (a.name || ('row' + i)) + '|' + (a.type || 'rec'); }
function ageLabel(a) { return `${a.name || '—'} ${a.type === 'comp' ? 'Comp/Travel' : 'Rec'}`; }

// ── 5 · pay ─────────────────────────────────────────────────────────────────
// ⚠️ THREE COLUMNS, NOT TWO. Centre, AR, and SOLO CENTRE — the rate when one
// referee works the game alone. Griswold comp U13–U15 is $60 / $35 / $95.
// The solo rate is real money and it has to be asked for, not derived.
function pPay() {
    const ags = getVal('ages.list', []).filter(a => String(a.name || '').trim());
    const el = document.getElementById('bd-pay'); if (!el) return;

    // ⭐ SPLIT UNDER REC AND COMP/TRAVEL, like Griswold's own pay page.
    //
    // Tod, 2026-10-21, looking at Stonington's form: "for ref pay shouldn't we
    // offer them rec and comp areas to fill out?" The table WAS rec/comp aware
    // — every row carried the word — but Eric had only ever added travel age
    // groups, so it read as a plain list of ages and the missing half was
    // completely silent.
    //
    // ⚠️ AN EMPTY HALF SAYS SO OUT LOUD. The point is seeing the hole. A
    // section that renders nothing looks identical to one that is finished.
    //
    // ⛔ NO ROWS ARE INVENTED. A club that genuinely runs no rec games should
    // not be asked for rec rates — it only points them back at Age Groups.
    // ⭐ BOTH HALVES ALWAYS SHOWN, AND AN EMPTY ONE IS AN ANSWER, NOT A GAP.
    //
    // Tod, 2026-10-21: "if they're only rec they only have to fill out the rec
    // section. If they're only comp, only the comp section. But they should
    // show both. If they don't have one of the others it should be crossed out
    // — no comp, or no rec, or it's both."
    //
    // ⚠️ An empty section could mean "we don't run rec" or "we forgot", and
    // those must not look the same. Ticking "we don't run any Rec games" makes
    // it a stated fact: the half greys out and strikes through, and the section
    // passes. Leaving it empty and unticked does NOT pass.
    //
    // Same thinking as "marked done but empty" on the review — a claim has to
    // be made deliberately before it counts for anything.
    const grid = (list, kind, flag) => {
        const none = !!getVal('pay.' + flag);
        const head = `<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 8px;">
                <div style="font-family:'Barlow Condensed',sans-serif; font-size:1rem; font-weight:800;
                            text-transform:uppercase; letter-spacing:0.8px;
                            color:${none ? '#9a9289' : '#09142a'}; ${none ? 'text-decoration:line-through;' : ''}">${kind}</div>
                ${!list.length ? `<label class="tick" style="font-weight:600; font-size:0.84rem;">
                    <input type="checkbox" ${none ? 'checked' : ''} onchange="setPayNone('${flag}', this.checked)">
                    <span>We don't run any ${kind} games</span></label>` : ''}
            </div>`;

        if (none) {
            return head + `<div style="opacity:0.55; font-size:0.84rem; color:#3f3a33; font-style:italic;
                        border-left:3px solid #e2d9ce; padding:6px 12px;">No ${kind.toLowerCase()} games — nothing to set here.</div>`;
        }
        if (!list.length) {
            return head + `<div style="background:#fffbeb; border:1px solid #fde68a; border-left:4px solid #f59e0b;
                        border-radius:7px; padding:10px 13px; font-size:0.84rem; color:#78350f;">
                    No <b>${kind}</b> age groups added yet. Add them in <b>Age groups</b> above and they will appear
                    here — or tick the box if you don't run ${kind.toLowerCase()} games at all.
                </div>`;
        }
        return head + `<table class="rates"><thead><tr>
                <th>Age group</th><th style="width:110px;">Centre<span class="must">*</span></th><th style="width:110px;">AR</th><th style="width:110px;">Solo centre</th>
            </tr></thead><tbody>
            ${list.map(({ a, i }) => { const k = ageKey(a, i); return `<tr>
                <td style="font-weight:700;">${esc(a.name)}</td>
                <td><div class="money"><input type="number" min="0" step="1" value="${esc(getVal('pay.' + k + '.center'))}"
                     oninput="setVal('pay.${k}.center', this.value)"></div></td>
                <td><div class="money"><input type="number" min="0" step="1" value="${esc(getVal('pay.' + k + '.ar'))}"
                     oninput="setVal('pay.${k}.ar', this.value)"></div></td>
                <td><div class="money"><input type="number" min="0" step="1" value="${esc(getVal('pay.' + k + '.solo'))}"
                     oninput="setVal('pay.${k}.solo', this.value)"></div></td>
            </tr>`; }).join('')}</tbody></table>`;
    };

    // ⚠️ The index must be the one from the FULL list — ageKey(a, i) is what
    // the saved answers are keyed on, so filtering first and re-indexing would
    // silently detach every rate already entered.
    const all  = getVal('ages.list', []).map((a, i) => ({ a, i })).filter(x => String(x.a.name || '').trim());
    const rec  = all.filter(x => x.a.type !== 'comp');
    const comp = all.filter(x => x.a.type === 'comp');

    el.innerHTML = `
        <p class="sec-help">What you pay a referee per game, per position. Leave a box blank if that
            position isn't paid for that age group.</p>
        ${!ags.length ? `<div class="warn">Fill in <b>Age groups</b> first — these tables are built from it.</div>` : `
        <div class="note"><b>Solo centre</b> is what you pay when one referee covers the whole game on
            their own, with no assistants. It's usually more than the normal centre rate.</div>
        ${grid(rec,  'Rec',         'no_rec')}
        ${grid(comp, 'Comp/Travel', 'no_comp')}`}
        ${secFoot('pay')}`;
}

// Ticking "we don't run these" is a declaration, so it saves like any answer.
function setPayNone(flag, on) { setVal('pay.' + flag, !!on); pPay(); }

// ── 6 · crew rules ──────────────────────────────────────────────────────────
// ⛔ ONE AR IS A REAL ANSWER, NOT A MISTAKE. East Haddam runs U10 with a centre
// and exactly ONE assistant, deliberately, for training. Any wording here that
// treats that as an error will get it "corrected" into something wrong.
function pCrew() {
    const ags = getVal('ages.list', []);
    const el = document.getElementById('bd-crew'); if (!el) return;
    el.innerHTML = `
        <p class="sec-help">How many officials on a game, by age group?</p>
        ${!ags.length ? `<div class="warn">Fill in <b>Age groups</b> first — this is built from it.</div>` : `
        <div class="note">Three is the usual full crew: a centre and two assistants. Some clubs run
            a centre and <b>one</b> assistant on their youngest groups on purpose, for training —
            if that's you, pick 2.</div>
        <table class="rates"><thead><tr>
            <th>Age group</th><th style="width:220px;">Officials per game<span class="must">*</span></th>
        </tr></thead><tbody>
        ${ags.map((a, i) => { const k = ageKey(a, i); return `<tr>
            <td style="font-weight:700;">${esc(ageLabel(a))}</td>
            <td><select onchange="setVal('crew.${k}', this.value)">
                <option value="">— not set —</option>
                <option value="3" ${getVal('crew.' + k) === '3' ? 'selected' : ''}>3 — centre + 2 assistants</option>
                <option value="2" ${getVal('crew.' + k) === '2' ? 'selected' : ''}>2 — centre + 1 assistant</option>
                <option value="1" ${getVal('crew.' + k) === '1' ? 'selected' : ''}>1 — centre only</option>
            </select></td>
        </tr>`; }).join('')}</tbody></table>`}
        ${secFoot('crew')}`;
}

// ── 7 · paying referees ─────────────────────────────────────────────────────
// ⭐ CHECK HAS A TAIL: if a club pays by check, referees need postal addresses
// on file before their first game. Saying so here is cheaper than finding out
// in November.
const PAY_METHODS = ['Venmo','Check','Cash App','Cash at Field','Direct Deposit','Zelle'];
const CUTOFFS = [
    ['thursday','Thursday midnight'], ['friday','Friday midnight'],
    ['24h','24 hours before kick-off'], ['none','We always pay for a cancelled game'],
    ['never','We never pay for a cancelled game'],
];
function pPolicy() {
    const ms = getVal('policy.methods', []);
    document.getElementById('bd-policy').innerHTML = `
        <p class="sec-help">How referees actually get their money, and what happens when a game is
            called off.</p>
        <label class="lbl">How do you pay referees? Tick all that apply.<span class="must">*</span></label>
        <div class="chips" style="margin-bottom:8px;">
            ${PAY_METHODS.map(m => `<button type="button" class="chip ${ms.includes(m) ? 'on' : ''}"
                onclick="toggleMethod('${m}')">${m}</button>`).join('')}
        </div>
        ${ms.includes('Check') ? `<div class="warn"><b>Paying by check?</b> We'll need a postal
            address on file for every referee before their first game, so the checks can actually
            reach them. We handle collecting those — just so you know it's coming.</div>` : ''}
        <div style="margin-top:16px;">
            <label class="lbl">If a game is called off late — not for weather — do the referees still get paid?</label>
            <select onchange="setVal('policy.cutoff', this.value)">
                <option value="">— not set —</option>
                ${CUTOFFS.map(([v, t]) => `<option value="${v}" ${getVal('policy.cutoff') === v ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
            <p style="font-size:0.85rem; color:#3f3a33; margin-top:6px;">Most clubs pick a point in
                the week after which a cancellation still gets paid, because the referee has
                already turned down other work.</p>
        </div>
        ${secFoot('policy')}`;
}
function toggleMethod(m) {
    const ms = [...getVal('policy.methods', [])];
    const i = ms.indexOf(m); if (i >= 0) ms.splice(i, 1); else ms.push(m);
    setVal('policy.methods', ms); pPolicy();
}

// ── 8 · pages ───────────────────────────────────────────────────────────────
// ⛔ THE CLUB ADMIN PAGE AND THE PUBLIC SCHEDULE ARE NOT QUESTIONS. Every club
// gets both. Only these two are optional.
function pPortals() {
    document.getElementById('bd-portals').innerHTML = `
        <p class="sec-help">Two of these are optional. The other two you get either way.</p>
        <div class="note"><b>You'll get these automatically:</b> a page where your scheduling
            contact submits games and asks for changes, and a public schedule page families can
            check — no logins, no referee names, no pay.</div>
        <div class="block">
            <label class="tick"><input type="checkbox" ${getVal('portals.audit') ? 'checked' : ''}
                onchange="setVal('portals.audit', this.checked)">
                <span><b>Audit page</b> — read-only oversight for your president: what's been paid,
                what's still owed, the season invoice, and the contract to sign.</span></label>
        </div>
        <div class="block">
            <label class="tick"><input type="checkbox" ${getVal('portals.payment') ? 'checked' : ''}
                onchange="setVal('portals.payment', this.checked)">
                <span><b>Payment page</b> — where your payment coordinator actually pays referees.
                Needs the payment coordinator filled in above.</span></label>
        </div>
        <div style="margin-top:14px;">
            <label class="lbl">Anything else we should know?</label>
            <textarea rows="3" placeholder="Field closures, a second season, anything unusual…"
                oninput="setVal('portals.notes', this.value)">${esc(getVal('portals.notes'))}</textarea>
        </div>
        ${secFoot('portals')}`;
}

// ── submit ──────────────────────────────────────────────────────────────────
// ⚠️ NEVER BLOCKS ON MISSING SECTIONS. A half-filled submission is worth far
// more than an abandoned one — the whole problem this page exists to fix is
// people giving up partway and nothing arriving at all.
// ⭐ CONFIRMED OR CHANGED? A pre-filled form can be ticked straight through
// without a word being read, and it would come back looking reviewed. Diffed
// against the snapshot taken when the link was made, so Tod's view can say
// "confirmed as-is" versus "changed the treasurer and added a field".
function changedSections() {
    const base = A._baseline;
    if (!base) return null;          // sent before snapshots existed
    const same = (x, y) => JSON.stringify(x ?? null) === JSON.stringify(y ?? null);
    return SECTIONS.map(s => s.key).filter(k => !same(A[k], base[k]));
}

async function submitAll() {
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('submitMsg');
    btn.disabled = true; btn.textContent = 'Sending…';
    const ch = changedSections();
    if (ch) A._changed = ch;
    const ok = await save(true);
    btn.disabled = false; btn.textContent = 'Send it in →';
    if (ok) {
        META.status = 'submitted';
        msg.style.color = '#0b7a3b';
        msg.innerHTML = '✅ Got it — thank you. We\'ll take it from here and come back to you if anything\'s unclear. You can keep editing this page if you need to.';
    } else {
        msg.style.color = '#b91c1c';
        msg.textContent = 'That didn\'t send. Your answers are still here — try again in a moment.';
    }
}
</script>
