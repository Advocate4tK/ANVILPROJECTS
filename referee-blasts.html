<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referee Blasts — Referee Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #060e20 !important;
            background-image: repeating-linear-gradient(
                15deg, transparent, transparent 56px,
                rgba(255,255,255,0.016) 56px, rgba(255,255,255,0.016) 58px
            ) !important;
        }
        .blasts-wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 60px; }

        /* ── Section headings ── */
        .bl-section-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #09142a;
            margin: 0 0 12px;
        }
        .bl-block { margin-bottom: 26px; }

        /* ── Pool chips ── */
        .pool-chips { display: flex; flex-wrap: wrap; gap: 10px; }
        .pool-chip {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: #fff;
            border: 1px solid #e2d9ce;
            border-radius: 10px;
            padding: 9px 13px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .pool-chip.is-active {
            border: 1.5px solid #00c853;
            background: #f0fdf4;
            box-shadow: 0 0 0 3px rgba(0,200,83,0.10);
        }
        .pool-chip .pc-dot {
            width: 11px; height: 11px; border-radius: 50%;
            flex-shrink: 0;
        }
        .pool-chip .pc-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.02rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #09142a;
        }
        .pool-chip .pc-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.74rem;
            color: #6b7280;
            background: rgba(9,20,42,0.06);
            padding: 1px 6px;
            border-radius: 5px;
        }
        .pc-active-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #065f46;
            background: #d1fae5;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .pc-setactive {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #09142a;
            background: #f0ece6;
            border: 1px solid #e2d9ce;
            border-radius: 6px;
            padding: 3px 9px;
            cursor: pointer;
        }
        .pc-setactive:hover { background: #e6ded2; }
        .pc-del {
            border: none; background: none; cursor: pointer;
            color: #b91c1c; font-size: 1rem; line-height: 1;
            padding: 0 2px; opacity: 0.55;
        }
        .pc-del:hover { opacity: 1; }
        .btn-new-pool {
            background: #09142a;
            color: #00c853;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        /* ── Amber eligibility banner ── */
        .elig-banner {
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-left: 4px solid #f59e0b;
            border-radius: 10px;
            padding: 12px 16px;
            color: #78350f;
            font-size: 0.9rem;
        }
        .elig-banner .eb-icon { font-size: 1.1rem; }
        .btn-cleanup {
            margin-left: auto;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #78350f;
            background: #fde68a;
            border: 1px solid #f59e0b;
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
        }
        .btn-cleanup:hover { background: #fcd34d; }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid #e2d9ce;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .filter-bar input[type="text"],
        .filter-bar select {
            padding: 8px 12px;
            border: 1.5px solid #e2d9ce;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            color: #09142a;
            background: #faf9f7;
            outline: none;
        }
        .filter-bar input[type="text"] { flex: 1; min-width: 200px; }
        .filter-bar input:focus, .filter-bar select:focus { border-color: #00c853; background:#fff; }
        .minor-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #09142a;
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #09142a;
            font-weight: 600;
        }

        /* ── Directory table ── */
        .dir-card {
            background: #fff;
            border: 1px solid #e2d9ce;
            border-radius: 10px;
            overflow: hidden;
        }
        .dir-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
        .dir-table thead th {
            text-align: left;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            background: #f4f6fa;
            padding: 9px 14px;
            border-bottom: 1px solid #e2d9ce;
            white-space: nowrap;
        }
        .dir-table tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid #f0ece6;
            vertical-align: top;
        }
        .dir-table tbody tr:hover { background: #fafbfd; }
        .ref-name {
            font-weight: 700;
            color: #09142a;
        }
        .ref-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #9ca3af;
            margin-right: 5px;
        }
        .ref-sub { font-size: 0.76rem; color: #6b7280; margin-top: 2px; }
        .dir-table a { color: #2563eb; text-decoration: none; }
        .dir-table a:hover { text-decoration: underline; }
        .muted-dash { color: #c4bdb2; }

        /* ── Expandable detail row (chevron) ── */
        .row-chevron {
            color: #00c853; font-size: 0.6rem; cursor: pointer;
            display: inline-block; transition: transform 0.2s; margin-right: 7px;
            vertical-align: middle;
        }
        .detail-row > td {
            background: #f7f9fc;
            border-bottom: 1px solid #f0ece6;
            padding: 4px 14px 14px 40px;
        }
        .det-field { min-width: 170px; }
        .det-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.6px; color: #9ca3af; margin-bottom: 1px; }
        .det-value { font-size: 0.86rem; color: #09142a; }

        /* ── Pills / badges ── */
        .cert-pill {
            display: inline-block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 9px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1e40af;
            white-space: nowrap;
        }
        .cert-none {
            font-size: 0.74rem;
            color: #b45309;
            font-style: italic;
        }
        .minor-badge {
            display: inline-block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.66rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1px 7px;
            border-radius: 20px;
            background: #fde68a;
            color: #78350f;
            margin-left: 6px;
            vertical-align: middle;
        }
        .pool-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 20px;
            padding: 2px 8px;
            margin: 0 4px 4px 0;
        }
        .pool-tag .pt-x { cursor: pointer; opacity: 0.55; font-size: 0.85rem; }
        .pool-tag .pt-x:hover { opacity: 1; }

        /* ── Actions cell / add-to-pool menu ── */
        .addpool-wrap { position: relative; display: inline-block; }
        .btn-addpool {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.74rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #09142a;
            background: #00c853;
            border: none;
            border-radius: 6px;
            padding: 5px 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-addpool:hover { background: #00e060; }
        .addpool-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #fff;
            border: 1px solid #e2d9ce;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(9,20,42,0.18);
            z-index: 50;
            min-width: 180px;
            padding: 5px;
        }
        .addpool-menu.open { display: block; }
        .addpool-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-radius: 5px;
            padding: 7px 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.84rem;
            color: #09142a;
            cursor: pointer;
        }
        .addpool-menu button:hover { background: #f0fdf4; }
        .addpool-menu .apm-empty { color: #9ca3af; font-size: 0.8rem; padding: 7px 10px; }

        .btn-addall {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #09142a;
            background: #00c853;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-addall:hover { background: #00e060; }
        .btn-addall:disabled { background: #e2ded7; color: #a99f92; cursor: not-allowed; }

        .btn-showmore {
            display: block;
            margin: 16px auto 0;
            background: #f0ece6;
            color: #09142a;
            border: 1px solid #e2d9ce;
            border-radius: 8px;
            padding: 9px 24px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.92rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .btn-showmore:hover { background: #e6ded2; }
        .empty-note { text-align: center; color: #9ca3af; padding: 34px 0; font-size: 0.9rem; }

        /* Lapsed USSF registration. Deliberately loud — this referee cannot
           legally work a game, and it must not read like just another pill. */
        /* Registration year, current. Quiet on purpose — the loud styling is
           reserved for the one that means "cannot work a game". */
        .reg-ok {
            font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
            color: #087a3c; font-weight: 600;
        }
        .exp-badge {
            display: inline-block;
            background: #c2564e; color: #fff;
            border-radius: 5px; padding: 1px 7px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem; font-weight: 800;
            letter-spacing: 0.6px; text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Primary tabs: Pools | Map ─────────────────────────────────────────
           These sit on the CREAM content area, not the navy header — text must be
           dark. White here is invisible. */
        .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 2px solid #ddd3c6; }
        .tabs button {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.05rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.4px;
            color: #8d8073; background: transparent;
            border: 0; border-bottom: 3px solid transparent;
            padding: 10px 26px; cursor: pointer; margin-bottom: -2px;
            transition: color .18s ease, border-color .18s ease;
        }
        .tabs button:hover { color: #09142a; }
        .tabs button.on { color: #00a844; border-bottom-color: #00c853; }

        /* ── Regions | Towns sub-toggle ────────────────────────────────────── */
        .seg {
            display: inline-flex; background: #0d1c38; border: 1px solid #1e3358;
            border-radius: 11px; padding: 4px; gap: 4px; margin-bottom: 14px;
        }
        .seg button {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.92rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.2px;
            color: rgba(255,255,255,0.55); background: transparent;
            border: 0; border-radius: 8px; padding: 8px 24px; cursor: pointer;
            transition: color .18s ease, background .18s ease;
        }
        .seg button:hover { color: rgba(255,255,255,0.85); }
        .seg button.on { background: #00c853; color: #06210f; box-shadow: 0 0 18px rgba(0,200,83,0.45); }

        /* ── Map ───────────────────────────────────────────────────────────── */
        .map-card {
            background: #f7f4ef; border: 1px solid #e2d9ce; border-radius: 14px;
            padding: 14px; margin-bottom: 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.35);
        }
        .map-stage {
            position: relative; border-radius: 11px; overflow: hidden; padding: 10px;
            background: radial-gradient(120% 90% at 50% 0%, #14294c 0%, #0a1730 55%, #071122 100%);
            box-shadow: inset 0 0 70px rgba(0,0,0,0.62), inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .map-stage svg { display: block; width: 100%; height: auto; }

        /* Border colour is set per town in paintMap() via --twn-stroke: a pale line
           disappears on a bright fill and a dark line disappears on a dark one, so
           it flips based on the fill's luminance. Hover/selected rules below have
           higher specificity and still win. */
        .twn {
            stroke: var(--twn-stroke, rgba(255,255,255,0.26));
            stroke-width: 0.9; cursor: pointer;
            transition: fill .16s ease, stroke .16s ease;
        }
        .twn:hover { stroke: #7fffb0; stroke-width: 1.4; }
        .twn.hot   { stroke: #7fffb0; stroke-width: 1.2; filter: brightness(1.45); }
        .twn.sel   { fill: #00c853 !important; stroke: #b6ffd2; stroke-width: 1.5; filter: url(#glow); }

        /* Every length below is in SVG USER UNITS — the whole map is ~1.47 wide.
           A "3px" stroke here would be twice the width of Connecticut. */
        .rgn-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800; letter-spacing: 0.004px; text-transform: uppercase;
            fill: rgba(255,255,255,0.95);
            paint-order: stroke; stroke: rgba(3,9,20,0.85); stroke-width: 0.006px;
            text-anchor: middle; pointer-events: none; user-select: none;
        }

        .tip {
            position: fixed; z-index: 60; pointer-events: none; display: none;
            background: rgba(4,12,26,0.96); border: 1px solid #00c853; border-radius: 9px;
            padding: 8px 12px; color: #fff; font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem; box-shadow: 0 10px 30px rgba(0,0,0,0.6); white-space: nowrap;
        }
        .tip b { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem;
                 letter-spacing: 0.6px; text-transform: uppercase; display: block; }
        .tip .tip-n { color: #00c853; font-weight: 700; }
        .tip .tip-r { color: rgba(255,255,255,0.55); font-size: 0.78rem; }

        .legend {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            margin-top: 10px; padding: 8px 4px 2px;
            font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: #6b7280;
        }
        .legend .sw { display: inline-flex; align-items: center; gap: 6px; }
        .legend .chip2 { width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.18); }

        /* Also on the cream area — dark text, and darker variants of the
           amber/blue warning colors so they hold contrast on a light background. */
        .map-note { font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
                    color: #7a6e60; margin: 0 0 14px; }
        .map-note.warn { color: #8a5a09; font-weight: 600; }
        .map-note.info { color: #1f5f96; font-weight: 600; }

        /* Green context bar for a live map selection (mirrors the pool-view bar) */
        .mapsel-bar {
            display: none; align-items: center; gap: 12px; flex-wrap: wrap;
            background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 4px solid #00c853;
            border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
        }

        /* ── Sticky recipient tray ─────────────────────────────────────────── */
        .tray {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none;
            background: rgba(6,14,32,0.97); border-top: 2px solid #00c853;
            box-shadow: 0 -12px 40px rgba(0,0,0,0.55); padding: 12px 20px;
        }
        .tray.on { display: block; }
        .tray-in { max-width: 1120px; margin: 0 auto; display: flex;
                   align-items: center; gap: 14px; flex-wrap: wrap; }
        .tray .big { font-family: 'Barlow Condensed', sans-serif; font-size: 1.7rem;
                     font-weight: 800; color: #00c853; letter-spacing: 1px; line-height: 1; }
        .tray .lbl { font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: rgba(255,255,255,0.6); }
        .tray .where { color: rgba(255,255,255,0.88); font-weight: 600; }
        .tbtn {
            font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            border-radius: 8px; padding: 9px 20px; cursor: pointer; border: 0;
        }
        .tbtn.gr { background: #00c853; color: #06210f; }
        .tbtn.gr:hover { background: #00e060; }
        .tbtn.gh { background: transparent; color: rgba(255,255,255,0.75);
                   border: 1px solid rgba(255,255,255,0.25); }
        .tbtn.gh:hover { border-color: #00c853; color: #fff; }
        .tbtn:disabled { opacity: 0.35; cursor: not-allowed; }
        .tray-msg { font-size: 0.8rem; color: #00c853; font-family: 'DM Sans', sans-serif; }
        body { padding-bottom: 90px; }

        /* ── Compose ───────────────────────────────────────────────────────── */
        .cmp-back {
            position: fixed; inset: 0; z-index: 70; display: none;
            background: rgba(4,10,22,0.75); backdrop-filter: blur(3px);
            overflow-y: auto; padding: 30px 16px 60px;
        }
        .cmp-back.on { display: block; }
        .cmp {
            max-width: 860px; margin: 0 auto; background: #f7f4ef;
            border: 1px solid #e2d9ce; border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden;
        }
        .cmp-hd {
            background: #09142a; padding: 16px 22px;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .cmp-hd h2 {
            font-family: 'Barlow Condensed', sans-serif; margin: 0;
            font-size: 1.5rem; font-weight: 800; letter-spacing: 1.2px;
            text-transform: uppercase; color: #fff;
        }
        .cmp-hd .to {
            font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
            color: rgba(255,255,255,0.65);
        }
        .cmp-hd .to b { color: #00c853; }
        .cmp-x {
            margin-left: auto; background: none; border: 0; cursor: pointer;
            color: rgba(255,255,255,0.55); font-size: 1.5rem; line-height: 1;
        }
        .cmp-x:hover { color: #fff; }

        .cmp-chan { display: flex; gap: 6px; padding: 14px 22px 0; }
        .cmp-chan button {
            font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.1px;
            background: #ece5db; color: #6b7280; border: 1px solid #ddd3c6;
            border-radius: 8px 8px 0 0; padding: 8px 20px; cursor: pointer;
        }
        .cmp-chan button.on { background: #fff; color: #09142a; border-bottom-color: #fff; }
        .cmp-chan button:disabled { opacity: 0.45; cursor: not-allowed; }

        .cmp-body { padding: 18px 22px 22px; }
        .cmp-row { margin-bottom: 14px; }
        .cmp-row label {
            display: block; font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.92rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.1px; color: #09142a; margin-bottom: 5px;
        }
        .cmp-row input[type=text], .cmp-row textarea {
            width: 100%; box-sizing: border-box; background: #fff;
            border: 1px solid #ddd3c6; border-radius: 9px; padding: 11px 13px;
            font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: #1f2937;
        }
        .cmp-row textarea { min-height: 190px; resize: vertical; line-height: 1.55; }
        .cmp-row input:focus, .cmp-row textarea:focus { outline: 2px solid #00c853; border-color: #00c853; }

        .tok { display: flex; gap: 7px; flex-wrap: wrap; margin: 7px 0 0; }
        .tok button {
            background: #eef7f0; border: 1px solid #bbf7d0; color: #087a3c;
            border-radius: 20px; padding: 4px 12px; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; font-size: 0.74rem;
        }
        .tok button:hover { background: #d8f0e0; }

        .cmp-prev {
            background: #fff; border: 1px dashed #c9bfb2; border-radius: 10px;
            padding: 14px 16px; font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; color: #374151; white-space: pre-wrap; line-height: 1.6;
        }

<script src="config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js?v=12"></script>
<script src="js/admin-auth.js?v=5"></script>
<script src="js/ct-towns.js?v=1"></script>
<script src="js/ct-regions.js?v=4"></script>
<script>
    // ── Auth gate: redirect to admin.html if not logged in ──────────────────
    checkAdminAccess();

    // ─────────────────────────────────────────────────────────────────────────
    // MINOR HANDLING / COMPLIANCE NOTE:
    // A referee is a MINOR when `age` is present and < 18. This page only makes
    // minors clearly VISIBLE (MINOR badge) and FILTERABLE. The compose/send
    // screen (v2, out of scope here) MUST enforce special handling for minors —
    // especially SMS blasts, which require guardian consent. Do NOT blast minors
    // by text without that gate. This v1 is pool-management only; no sending.
    // ─────────────────────────────────────────────────────────────────────────

    let MY_UID   = null;   // logged-in assignor's Supabase auth uid
    let MY_ROLE  = null;
    let POOLS    = [];     // [{id, name, active, ...}]
    let REFS     = [];     // referee directory (shared, all rows)
    let MEMBERS  = [];     // pool_members rows for MY pools
    let refPoolMap = {};   // referee_id -> Set(pool_id) (my pools only)
    let PAGE_SIZE = 50;
    let shown     = PAGE_SIZE;
    let lastFiltered = [];

    // Stable color per pool (by index) for the chip dot / tags
    const POOL_COLORS = ['#00c853','#3498db','#9b59b6','#e67e22','#e74c3c','#16a085','#f39c12','#2c3e50'];
    function poolColor(poolId) {
        const idx = POOLS.findIndex(p => p.id === poolId);
        return POOL_COLORS[(idx >= 0 ? idx : 0) % POOL_COLORS.length];
    }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function isMinor(r) { return r.age != null && Number(r.age) < 18; }

    // A referee whose USSF registration year has lapsed cannot work a game,
    // whatever their certification says. Derived, never stored — a stored flag
    // would go stale the moment the calendar turns over.
    // Unknown (null) is NOT treated as expired: most of the roster predates the
    // column, and flagging 580 people red would make the badge meaningless.
    const SEASON_YEAR = new Date().getFullYear();
    function isExpired(r) {
        const y = r.registration_year;
        return y != null && Number(y) < SEASON_YEAR;
    }
    function hasCert(r) {
        const c = r['Certification Level'];
        return !!(c && String(c).trim());
    }

    // ── Boot ────────────────────────────────────────────────────────────────
    (async () => {
        MY_UID = currentUserId();
        if (!MY_UID) { window.location.href = 'admin.html'; return; }

        // Current assignor record (scope key = their auth uid; clubs unused in v1)
        const { data: me } = await supabaseClient.client
            .from('assignors')
            .select('auth_user_id, name, role, clubs')
            .eq('auth_user_id', MY_UID)
            .single();
        MY_ROLE = me?.role || null;

        document.body.style.visibility = 'visible';

        await Promise.all([loadPools(), loadReferees()]);
        renderAll();
    })();

    // ── Data loads ────────────────────────────────────────────────────────────
    async function loadPools() {
        // Pools are scoped per-assignor: only pools this assignor owns.
        const { data: pools, error } = await supabaseClient.client
            .from('referee_pools')
            .select('id, name, description, active, created_at')
            .eq('owner_uid', MY_UID)
            .order('created_at', { ascending: true });
        POOLS = error ? [] : (pools || []);

        // Member rows for my pools (drives per-pool counts + the "Pools" column)
        MEMBERS = [];
        refPoolMap = {};
        if (POOLS.length) {
            const poolIds = POOLS.map(p => p.id);
            const { data: mem } = await supabaseClient.client
                .from('pool_members')
                .select('id, pool_id, referee_id')
                .in('pool_id', poolIds);
            MEMBERS = mem || [];
            MEMBERS.forEach(m => {
                (refPoolMap[m.referee_id] = refPoolMap[m.referee_id] || new Set()).add(m.pool_id);
            });
        }
    }

    function poolCount(poolId) {
        return MEMBERS.filter(m => m.pool_id === poolId).length;
    }

    async function loadReferees() {
        // Directory is SHARED across all assignors — show every referee.
        // Multi-word columns are Title Case WITH SPACES → must be quoted.
        const { data: refs, error } = await supabaseClient.client
            .from('referees')
            .select('*')
            .order('name');
        REFS = error ? [] : (refs || []);
    }

    // ── Renderers ───────────────────────────────────────────────────────────
    function renderAll() {
        renderPools();
        renderBanner();
        renderPoolFilterOptions();
        renderTownFilterOptions();
        applyFilters();
    }

    function renderTownFilterOptions() {
        const sel = document.getElementById('fTown');
        if (!sel) return;
        const cur = sel.value;
        // distinct, non-blank towns with counts, alphabetical
        const counts = {};
        REFS.forEach(r => { const c = (r.city || '').trim(); if (c) counts[c] = (counts[c] || 0) + 1; });
        const towns = Object.keys(counts).sort((a, b) => a.localeCompare(b));
        sel.innerHTML = '<option value="">All Towns</option>' +
            towns.map(t => `<option value="${esc(t)}">${esc(t)} (${counts[t]})</option>`).join('');
        sel.value = cur;
    }

    function renderPools() {
        const wrap = document.getElementById('poolChips');
        if (!POOLS.length) {
            wrap.innerHTML = '<span style="color:#9ca3af; font-size:0.88rem;">No pools yet — create one with “+ New Pool”.</span>';
            return;
        }
        wrap.innerHTML = POOLS.map(p => {
            const active = !!p.active;
            const cnt = poolCount(p.id);
            return `
            <div class="pool-chip ${active ? 'is-active' : ''}">
                <span class="pc-click" onclick="viewPool(${p.id})" title="Click to view the ${cnt} referee${cnt === 1 ? '' : 's'} in ${esc(p.name)}" style="display:inline-flex; align-items:center; gap:9px; cursor:pointer;">
                    <span class="pc-dot" style="background:${poolColor(p.id)};"></span>
                    <span class="pc-name">${esc(p.name)}</span>
                    <span class="pc-count">${cnt}</span>
                </span>
                ${active
                    ? '<span class="pc-active-label">Active</span>'
                    : `<button class="pc-setactive" onclick="setActive(${p.id})">Set Active</button>`}
                <button class="pc-del" title="Delete pool" onclick="deletePool(${p.id}, '${esc(p.name).replace(/'/g,"\\'")}')">×</button>
            </div>`;
        }).join('');
    }

    function renderBanner() {
        const noCert = REFS.filter(r => !hasCert(r)).length;
        const banner = document.getElementById('eligBanner');
        if (noCert > 0) {
            document.getElementById('eligText').textContent =
                `${noCert} referee${noCert === 1 ? ' has' : 's have'} no certification level on record.`;
            banner.style.display = 'flex';
        } else {
            banner.style.display = 'none';
        }
    }

    function renderPoolFilterOptions() {
        const sel = document.getElementById('fPool');
        const cur = sel.value;
        sel.innerHTML = '<option value="">All Pools</option>' +
            POOLS.map(p => `<option value="${p.id}">${esc(p.name)} (${poolCount(p.id)})</option>`).join('');
        sel.value = cur;
    }

    // Click a pool chip → filter the directory down to just that pool's members
    function viewPool(poolId) {
        const sel = document.getElementById('fPool');
        if (sel) { sel.value = String(poolId); applyFilters(); }
        const fb = document.querySelector('.filter-bar');
        if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Green context bar shown while viewing a single pool's members
    function renderPoolViewBar() {
        const bar = document.getElementById('poolViewBar');
        if (!bar) return;
        const poolId = document.getElementById('fPool').value;
        const p = poolId ? POOLS.find(x => x.id === Number(poolId)) : null;
        if (!p) { bar.style.display = 'none'; return; }
        const cnt = poolCount(p.id);
        document.getElementById('poolViewText').textContent =
            `Viewing “${p.name}” — ${cnt} member${cnt === 1 ? '' : 's'}.`;
        document.getElementById('poolViewAdd').onclick   = () => addMoreToPool(p.id);
        document.getElementById('poolViewClear').onclick = () => { document.getElementById('fPool').value = ''; applyFilters(); };
        bar.style.display = 'flex';
    }

    // ── Filtering + table ─────────────────────────────────────────────────────
    function applyFilters() {
        const q      = document.getElementById('fSearch').value.trim().toLowerCase();
        const poolId = document.getElementById('fPool').value;
        const town   = document.getElementById('fTown').value;
        const cert   = document.getElementById('fCert').value;
        const minor  = document.getElementById('fMinor').value;

        lastFiltered = REFS.filter(r => {
            if (q) {
                const hay = `${r.name || ''} ${r.email || ''} ${r['Email 2'] || ''} ${r.city || ''}`.toLowerCase();
                if (!hay.includes(q)) return false;
            }
            if (poolId) {
                const set = refPoolMap[r.id];
                if (!set || !set.has(Number(poolId))) return false;
            }
            if (town && (r.city || '').trim() !== town) return false;
            // Map selection is a coarse cut applied BEFORE the fine filters below,
            // so you can take a whole region and then strip out minors / no-certs.
            if (mapTowns.size) {
                const t = resolveTown(r.city);
                if (!t || !mapTowns.has(t)) return false;
            }
            if (cert === 'has'  && !hasCert(r)) return false;
            if (cert === 'none' &&  hasCert(r)) return false;
            // The renewal-campaign filter: expired referees are the ones you
            // most want to email and least want to assign.
            if (cert === 'expired' && !isExpired(r)) return false;
            if (cert === 'current' && (isExpired(r) || r.registration_year == null)) return false;
            if (minor === 'minors' && !isMinor(r)) return false;
            if (minor === 'hide'   &&  isMinor(r)) return false;
            return true;
        });

        shown = PAGE_SIZE;
        renderPoolViewBar();
        renderMapSelBar();
        renderTable();
        renderTray();
    }

    function renderTable() {
        const body = document.getElementById('dirBody');
        const total = lastFiltered.length;
        document.getElementById('filterCount').textContent =
            `${total} referee${total === 1 ? '' : 's'}`;
        updateAddAllBtn();

        if (!total) {
            body.innerHTML = '<tr><td colspan="8" class="empty-note">No referees match these filters.</td></tr>';
            document.getElementById('showMoreBtn').style.display = 'none';
            return;
        }

        const page = lastFiltered.slice(0, shown);
        body.innerHTML = page.map(r => rowHtml(r)).join('');

        const more = document.getElementById('showMoreBtn');
        if (total > shown) {
            more.style.display = 'block';
            more.textContent = `Show more (${total - shown} more)`;
        } else {
            more.style.display = 'none';
        }
    }

    function rowHtml(r) {
        const minor = isMinor(r);
        const agePart = (r.age != null && r.age !== '') ? ` · ${r.age}y` : '';
        const town = r.city && String(r.city).trim();
        const email = r.email && String(r.email).trim();
        const phone = r.phone && String(r.phone).trim();

        const certCell = hasCert(r)
            ? `<span class="cert-pill">${esc(r['Certification Level'])}</span>`
            : `<span class="cert-none">no cert</span>`;

        // Registration standing is a STATUS, not a certification. A referee can
        // hold a perfectly valid Grassroots grade and still be ineligible.
        const statusCell = isExpired(r)
            ? `<span class="exp-badge" title="USSF registration lapsed in ${esc(r.registration_year)} — cannot be assigned">EXPIRED ${esc(r.registration_year)}</span>`
            : (r.registration_year
                ? `<span class="reg-ok" title="USSF registration current">${esc(r.registration_year)}</span>`
                : '<span class="muted-dash">—</span>');

        // "Pools" column — which of MY pools this ref is in (with remove ×)
        const set = refPoolMap[r.id];
        const poolTags = (set && set.size)
            ? [...set].map(pid => {
                const p = POOLS.find(x => x.id === pid);
                if (!p) return '';
                return `<span class="pool-tag" style="background:${poolColor(pid)}22; color:${poolColor(pid)};">
                    ${esc(p.name)}
                    <span class="pt-x" title="Remove from ${esc(p.name)}" onclick="removeFromPool(${r.id}, ${pid})">×</span>
                </span>`;
              }).join('')
            : '<span class="muted-dash">—</span>';

        // Add-to-pool menu (only pools this ref is NOT already in)
        const addable = POOLS.filter(p => !(set && set.has(p.id)));
        const menuItems = addable.length
            ? addable.map(p => `<button onclick="addToPool(${r.id}, ${p.id})">+ ${esc(p.name)}</button>`).join('')
            : '<div class="apm-empty">In all pools</div>';
        const addMenu = POOLS.length
            ? `<div class="addpool-wrap">
                    <button class="btn-addpool" onclick="toggleAddMenu(event, ${r.id})">+ Pool</button>
                    <div class="addpool-menu" id="apm-${r.id}">${menuItems}</div>
               </div>`
            : '<span class="muted-dash" style="font-size:0.76rem;">no pools</span>';

        return `
        <tr>
            <td>
                <span class="row-chevron" id="chev-${r.id}" onclick="toggleDetail(event, ${r.id})" title="Show details">▶</span>
                <span class="ref-name"><span class="ref-id">#${r.id}</span>${esc(r.name) || '—'}${agePart}${minor ? '<span class="minor-badge">Minor</span>' : ''}</span>
            </td>
            <td>${email ? `<a href="mailto:${esc(email)}">${esc(email)}</a>` : '<span class="muted-dash">—</span>'}</td>
            <td>${phone ? `<a href="tel:${esc(phone)}">${esc(phone)}</a>` : '<span class="muted-dash">—</span>'}</td>
            <td>${town ? `${esc(town)}${r.state ? ` <span style="color:#9ca3af;font-size:0.82em;">${esc(r.state)}</span>` : ''}` : '<span class="muted-dash">—</span>'}</td>
            <td>${certCell}</td>
            <td>${statusCell}</td>
            <td>${poolTags}</td>
            <td style="text-align:right;">${addMenu}</td>
        </tr>
        <tr class="detail-row" id="det-${r.id}" style="display:none;"><td colspan="8">${detailHtml(r)}</td></tr>`;
    }

    // Full detail shown when a row's chevron is expanded
    function detailHtml(r) {
        const addr = [r.address, r.city, r.state, r['Zip Code'] || r.zip].filter(Boolean).join(', ');
        const optEmail = r.email_opt_in === false ? 'No' : 'Yes';
        const optSms   = r.sms_opt_in   === false ? 'No' : 'Yes';
        const fields = [
            ['Email 2', r['Email 2']],
            ['Email 3', r['Email 3']],
            ['Phone', r.phone],
            ['Address', addr],
            ['Age', r.age],
            ['Years Reffing', r['Years Reffing']],
            ['Certification', r['Certification Level']],
            ['Age Groups Preferred', r['Age Groups Preferred']],
            ['Gender', r.Gender],
            ['Rating', r.rating],
            ['Club Preference', r['Club Preference']],
            ['Source Club', r.source_club],
            ['Email opt-in', optEmail],
            ['Text opt-in', optSms],
            ['Notes', r.notes],
        ];
        const cells = fields
            .filter(([, v]) => v != null && String(v).trim() !== '')
            .map(([k, v]) => `<div class="det-field"><div class="det-label">${k}</div><div class="det-value">${esc(String(v))}</div></div>`)
            .join('');
        return `<div style="display:flex; flex-wrap:wrap; gap:14px 26px;">${cells || '<span class="muted-dash">No extra details on file yet — fills in when they log in.</span>'}</div>`;
    }

    function toggleDetail(evt, id) {
        if (evt) evt.stopPropagation();
        const row = document.getElementById('det-' + id);
        const ch  = document.getElementById('chev-' + id);
        if (!row) return;
        const open = row.style.display === 'none';
        row.style.display = open ? 'table-row' : 'none';
        if (ch) ch.style.transform = open ? 'rotate(90deg)' : 'rotate(0deg)';
    }

    function showMore() { shown += PAGE_SIZE; renderTable(); }

    // ── Bulk add: everyone in the current filter → the ACTIVE pool ────────────
    function activePool() { return POOLS.find(p => p.active) || null; }

    function updateAddAllBtn() {
        const btn  = document.getElementById('btnAddAll');
        const hint = document.getElementById('addAllHint');
        if (!btn) return;
        const active = activePool();
        if (!active) {
            btn.disabled = true;
            btn.textContent = '➕ Add all shown → active pool';
            hint.textContent = 'Set a pool “Active” (click a pool chip) to enable bulk-add.';
            return;
        }
        const toAdd = lastFiltered.filter(r => !(refPoolMap[r.id] && refPoolMap[r.id].has(active.id)));
        btn.disabled = toAdd.length === 0;
        btn.textContent = `➕ Add ${toAdd.length} shown → ${active.name}`;
        hint.textContent = toAdd.length === 0
            ? (lastFiltered.length ? `All shown are already in “${active.name}”.` : 'No referees shown.')
            : `Adds the ${toAdd.length} not yet in “${active.name}” — filter by Town, then click.`;
    }

    async function addAllShownToActive() {
        const active = activePool();
        if (!active) { alert('Set a pool “Active” first — click “Set Active” on a pool chip.'); return; }
        const toAdd = lastFiltered.filter(r => !(refPoolMap[r.id] && refPoolMap[r.id].has(active.id)));
        if (!toAdd.length) { alert(`All shown referees are already in “${active.name}”.`); return; }
        if (!confirm(`Add ${toAdd.length} referee${toAdd.length === 1 ? '' : 's'} to “${active.name}”?`)) return;
        // Pre-filtered to non-members, so no unique-constraint collisions.
        const rows = toAdd.map(r => ({ pool_id: active.id, referee_id: r.id }));
        const { error } = await supabaseClient.client.from('pool_members').insert(rows);
        if (error) { alert('Bulk add failed: ' + error.message); return; }
        await loadPools();
        renderAll();
    }

    // ── Pool actions ──────────────────────────────────────────────────────────
    async function newPool() {
        const name = (prompt('Name for the new pool:') || '').trim();
        if (!name) return;
        // First pool becomes active automatically; otherwise inactive.
        const makeActive = POOLS.length === 0;
        const { error } = await supabaseClient.client
            .from('referee_pools')
            .insert({ name, owner_uid: MY_UID, active: makeActive });
        if (error) { alert('Could not create pool: ' + error.message); return; }
        await loadPools();
        renderAll();
    }

    async function setActive(poolId) {
        // Only one active pool at a time per assignor.
        await supabaseClient.client
            .from('referee_pools')
            .update({ active: false })
            .eq('owner_uid', MY_UID);
        const { error } = await supabaseClient.client
            .from('referee_pools')
            .update({ active: true })
            .eq('id', poolId)
            .eq('owner_uid', MY_UID);
        if (error) { alert('Could not set active: ' + error.message); return; }
        await loadPools();
        renderAll();
    }

    // From the pool-view bar: make this pool the bulk-add target, then show the
    // full roster so you can filter a town + "Add all", or +Pool individuals.
    async function addMoreToPool(poolId) {
        await setActive(poolId);
        const sel = document.getElementById('fPool');
        if (sel) sel.value = '';   // clear the member-only filter → full roster
        applyFilters();
        const fb = document.querySelector('.filter-bar');
        if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function deletePool(poolId, name) {
        if (!confirm(`Delete pool "${name}"? Members are removed from the pool (referees themselves are NOT deleted).`)) return;
        const { error } = await supabaseClient.client
            .from('referee_pools')
            .delete()
            .eq('id', poolId)
            .eq('owner_uid', MY_UID);   // pool_members cascade via FK ON DELETE CASCADE
        if (error) { alert('Could not delete pool: ' + error.message); return; }
        await loadPools();
        renderAll();
    }

    // ── Membership actions ──────────────────────────────────────────────────
    async function addToPool(refId, poolId) {
        closeAllMenus();
        const { error } = await supabaseClient.client
            .from('pool_members')
            .insert({ pool_id: poolId, referee_id: refId });
        // 23505 = unique_violation (already a member) → treat as success/no-op
        if (error && error.code !== '23505') { alert('Could not add to pool: ' + error.message); return; }
        await loadPools();
        renderPools();
        renderPoolFilterOptions();
        renderTable();
    }

    async function removeFromPool(refId, poolId) {
        const { error } = await supabaseClient.client
            .from('pool_members')
            .delete()
            .eq('pool_id', poolId)
            .eq('referee_id', refId);
        if (error) { alert('Could not remove from pool: ' + error.message); return; }
        await loadPools();
        renderPools();
        renderPoolFilterOptions();
        renderTable();
    }

    // ── Add-to-pool dropdown menu handling ──────────────────────────────────
    function toggleAddMenu(evt, refId) {
        evt.stopPropagation();
        const menu = document.getElementById('apm-' + refId);
        const wasOpen = menu.classList.contains('open');
        closeAllMenus();
        if (!wasOpen) menu.classList.add('open');
    }
    function closeAllMenus() {
        document.querySelectorAll('.addpool-menu.open').forEach(m => m.classList.remove('open'));
    }
    document.addEventListener('click', closeAllMenus);

    // ── "Clean Up" — filter table to no-cert refs ─────────────────────────────
    function cleanupNoCert() {
        document.getElementById('fCert').value = 'none';
        document.getElementById('fSearch').value = '';
        document.getElementById('fPool').value = '';
        document.getElementById('fMinor').value = '';
        applyFilters();
        document.querySelector('.filter-bar').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ═════════════════════════════════════════════════════════════════════════
    //  MAP TAB
    //  The map is a COARSE selector: clicking paints towns into `mapTowns`, then
    //  applyFilters() does the rest. It never renders its own referee list — the
    //  directory table below is the single list for every tab.
    // ═════════════════════════════════════════════════════════════════════════

    let mapMode   = 'regions';
    let mapTowns  = new Set();   // town names currently selected on the map
    let mapLabel  = '';          // region name, when a whole region was taken
    let mapDrawn  = false;

    // ── Town resolution ──────────────────────────────────────────────────────
    const TOWN_LC = {}, TOWN_SQ = {}, ALIAS_SQ = {};
    CT_TOWNS.towns.forEach(t => {
        TOWN_LC[t.n.toLowerCase()] = t.n;
        TOWN_SQ[t.n.toLowerCase().replace(/[^a-z]/g, '')] = t.n;
    });
    Object.entries(CT_TOWN_ALIASES).forEach(([k, v]) => { ALIAS_SQ[k.replace(/[^a-z]/g, '')] = v; });

    const FUZZY = {};   // raw city text -> town, for anything matched by best guess

    function lev(a, b) {
        if (Math.abs(a.length - b.length) > 1) return 9;
        const n = b.length;
        let prev = Array.from({ length: n + 1 }, (_, i) => i);
        for (let i = 1; i <= a.length; i++) {
            const cur = [i];
            for (let j = 1; j <= n; j++)
                cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
            prev = cur;
        }
        return prev[n];
    }

    function tryPart(s) {
        s = s.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!s) return null;
        if (/^(ct|conn|connecticut|ma|ri|ny|mass)$/.test(s)) return null;
        s = s.replace(/ (ct|conn|connecticut|mass|ma|ri|ny)$/, '').trim();
        if (!s) return null;

        if (CT_TOWN_ALIASES[s]) return CT_TOWN_ALIASES[s];
        if (TOWN_LC[s]) return TOWN_LC[s];

        const dir = { s: 'south', n: 'north', e: 'east', w: 'west', mt: 'mount', ft: 'fort' };
        const parts = s.split(' ');
        if (parts.length > 1 && dir[parts[0]]) {
            const x = [dir[parts[0]], ...parts.slice(1)].join(' ');
            if (CT_TOWN_ALIASES[x]) return CT_TOWN_ALIASES[x];
            if (TOWN_LC[x]) return TOWN_LC[x];
        }

        const m = s.replace(/^town of /, '').replace(/ (center|centre|village|depot|heights)$/, '').trim();
        if (CT_TOWN_ALIASES[m]) return CT_TOWN_ALIASES[m];
        if (TOWN_LC[m]) return TOWN_LC[m];

        const sq = s.replace(/[^a-z]/g, '');
        if (ALIAS_SQ[sq]) return ALIAS_SQ[sq];
        if (TOWN_SQ[sq])  return TOWN_SQ[sq];
        return null;
    }

    function tryFuzzy(s) {
        const sq = s.replace(/[^a-z]/g, '');
        if (sq.length < 5) return null;
        const hits = new Set();
        Object.entries(TOWN_SQ).forEach(([k, v]) => { if (lev(sq, k) === 1) hits.add(v); });
        Object.entries(ALIAS_SQ).forEach(([k, v]) => { if (lev(sq, k) === 1) hits.add(v); });
        return hits.size === 1 ? [...hits][0] : null;
    }

    const _townCache = {};
    function resolveTown(raw) {
        if (!raw) return null;
        if (raw in _townCache) return _townCache[raw];
        const base = String(raw).toLowerCase().replace(/\s+/g, ' ').trim();
        let out = null;
        if (base) {
            const segs = [base, ...base.split(',')].map(x => x.trim()).filter(Boolean);
            for (const seg of segs) { const h = tryPart(seg); if (h) { out = h; break; } }
            if (!out) for (const seg of segs) {
                const h = tryFuzzy(seg.replace(/[^a-z0-9 ]/g, ' ').trim());
                if (h) { FUZZY[raw] = h; out = h; break; }
            }
        }
        _townCache[raw] = out;
        return out;
    }

    // ── Regions (defaults ship in ct-regions.js; overrides are local) ─────────
    let REGIONS = {}, townRegion = {};
    function loadRegions() {
        REGIONS = JSON.parse(JSON.stringify(CT_REGIONS));
        try {
            const ov = JSON.parse(localStorage.getItem('ctRegionOverrides') || '{}');
            Object.entries(ov).forEach(([town, rgn]) => {
                Object.values(REGIONS).forEach(r => {
                    const i = r.towns.indexOf(town);
                    if (i >= 0) r.towns.splice(i, 1);
                });
                if (REGIONS[rgn]) REGIONS[rgn].towns.push(town);
            });
        } catch(e) { /* bad override blob — defaults stand */ }
        townRegion = {};
        Object.entries(REGIONS).forEach(([name, r]) => r.towns.forEach(t => { townRegion[t] = name; }));
    }

    // ── Shading ──────────────────────────────────────────────────────────────
    // Density is BLUE, never green. Green (#00c853) means "selected" everywhere in
    // this tool — if it also meant "lots of referees", clicking a busy town would
    // be green-to-green and read as nothing happening.
    // Each step changes HUE as well as lightness (deep indigo -> cyan). Steps that
    // differ only in lightness are genuinely hard to tell apart — the first version
    // of this ramp made you squint at the top two tiers.
    const SCALE = [
        { max: 0,        fill: '#1e2c47', label: 'none' },
        { max: 2,        fill: '#2a4d90', label: '1–2'  },
        { max: 5,        fill: '#2f7bc7', label: '3–5'  },
        { max: 10,       fill: '#2fa6dd', label: '6–10' },
        { max: Infinity, fill: '#62d6f7', label: '11+'  }
    ];
    const shadeFor = n => (SCALE.find(s => n <= s.max) || SCALE[0]).fill;

    function mixHue(hex, n) {
        // Floor is deliberately high: an empty town still has to read as part of
        // its region, or half the state vanishes and it looks like a broken render.
        const t = Math.min(1, 0.42 + Math.log10(n + 1) / Math.log10(30) * 0.58);
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        const c = (a, bch) => Math.round(bch + (a - bch) * t).toString(16).padStart(2,'0');
        return `#${c(r,0x24)}${c(g,0x35)}${c(b,0x53)}`;
    }

    // Border that stays visible whatever it's drawn on. A white hairline is
    // invisible against a bright town; a dark one is invisible against an empty
    // one. Flip on perceived luminance so towns always read as separate shapes.
    function strokeOn(fill) {
        const r = parseInt(fill.slice(1,3),16),
              g = parseInt(fill.slice(3,5),16),
              b = parseInt(fill.slice(5,7),16);
        const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
        return lum > 0.42 ? 'rgba(4,12,26,0.62)' : 'rgba(255,255,255,0.32)';
    }

    // referees per town, from the shared directory
    let refsByTown = {};
    function buildTownIndex() {
        refsByTown = {};
        REFS.forEach(r => {
            const t = resolveTown(r.city);
            if (t) (refsByTown[t] = refsByTown[t] || []).push(r);
        });
    }
    const townCount = t => (refsByTown[t] || []).length;

    // ── Draw ─────────────────────────────────────────────────────────────────
    function drawMap() {
        if (mapDrawn) return;
        loadRegions();
        buildTownIndex();

        const paths = CT_TOWNS.towns.map(t =>
            `<path class="twn" data-town="${esc(t.n)}" d="${t.d}" vector-effect="non-scaling-stroke"></path>`
        ).join('');

        const labels = Object.entries(REGIONS).map(([name, r]) => {
            const pts = r.towns.map(n => CT_TOWNS.towns.find(t => t.n === n)).filter(Boolean);
            if (!pts.length) return '';
            const cx = pts.reduce((a,p) => a + p.cx, 0) / pts.length;
            const cy = pts.reduce((a,p) => a + p.cy, 0) / pts.length;
            return `<text class="rgn-label rlab" x="${cx}" y="${cy}" style="font-size:0.028px;">${esc(name.toUpperCase())}</text>`;
        }).join('');

        document.getElementById('mapStage').innerHTML = `
            <svg viewBox="${CT_TOWNS.viewBox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Connecticut towns">
                <defs>
                    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
                        <feDropShadow dx="0" dy="0" stdDeviation="0.006" flood-color="#00c853" flood-opacity="0.95"/>
                        <feDropShadow dx="0" dy="0" stdDeviation="0.016" flood-color="#00c853" flood-opacity="0.55"/>
                    </filter>
                </defs>
                <g>${paths}</g>
                <g>${labels}</g>
            </svg>`;

        document.querySelectorAll('#mapStage .twn').forEach(el => {
            el.addEventListener('click', () => clickTown(el.dataset.town));
            el.addEventListener('mouseenter', () => hotRegion(el.dataset.town));
            el.addEventListener('mousemove', e => showTip(e, el.dataset.town));
            el.addEventListener('mouseleave', hideTip);
        });

        mapDrawn = true;
        setMapNote();
        reportUnmatched();
        paintMap();
    }

    // One source for this copy — it lived in two places and went stale in one
    // of them the moment green stopped meaning "lots of referees".
    function setMapNote() {
        document.getElementById('mapNote').textContent = mapMode === 'regions'
            ? 'Click anywhere in a region to take the whole region. Stronger colour means more referees in that town. Selected turns green.'
            : 'Click individual towns — they add up. Brighter blue means more referees on file, dark navy means none. Selected turns green.';
    }

    function paintMap() {
        document.querySelectorAll('.rlab').forEach(l => l.style.display = mapMode === 'regions' ? '' : 'none');

        document.querySelectorAll('#mapStage .twn').forEach(el => {
            const name = el.dataset.town;
            const n = townCount(name);
            const rgn = townRegion[name];
            el.classList.toggle('sel', mapTowns.has(name));
            const fill = mapMode === 'regions'
                ? (rgn ? mixHue(REGIONS[rgn].color, n) : '#243553')
                : shadeFor(n);
            el.style.fill = fill;
            el.style.setProperty('--twn-stroke', strokeOn(fill));
        });

        document.getElementById('mapLegend').innerHTML = mapMode === 'towns'
            ? '<span style="font-weight:700;color:#09142a;">Referees per town</span>' +
              SCALE.map(s => `<span class="sw"><span class="chip2" style="background:${s.fill}"></span>${s.label}</span>`).join('')
            : '<span style="font-weight:700;color:#09142a;">Regions</span>' +
              Object.entries(REGIONS).map(([n, r]) => {
                  const tot = r.towns.reduce((a,t) => a + townCount(t), 0);
                  return `<span class="sw"><span class="chip2" style="background:${r.color}"></span>${esc(n)} <b style="color:#00a844;">${tot}</b></span>`;
              }).join('');
    }

    // ── Interaction ──────────────────────────────────────────────────────────
    function setTab(which) {
        document.getElementById('tabPools').classList.toggle('on', which === 'pools');
        document.getElementById('tabMap').classList.toggle('on', which === 'map');
        document.getElementById('poolsPanel').style.display = which === 'pools' ? '' : 'none';
        document.getElementById('mapPanel').style.display   = which === 'map'   ? '' : 'none';
        // Selections deliberately SURVIVE a tab switch — grab a region, then add
        // your hand-picked crew on top, and send once.
        if (which === 'map') drawMap();
    }

    function setMapMode(m) {
        mapMode = m;
        document.getElementById('segRegions').classList.toggle('on', m === 'regions');
        document.getElementById('segTowns').classList.toggle('on', m === 'towns');
        setMapNote();
        clearMapSel();
    }

    function clickTown(name) {
        if (mapMode === 'regions') {
            const rgn = townRegion[name];
            if (!rgn) return;
            const towns = REGIONS[rgn].towns;
            const allIn = towns.every(t => mapTowns.has(t));
            towns.forEach(t => allIn ? mapTowns.delete(t) : mapTowns.add(t));
            mapLabel = allIn ? '' : rgn;
        } else {
            mapTowns.has(name) ? mapTowns.delete(name) : mapTowns.add(name);
            mapLabel = '';
        }
        paintMap();
        applyFilters();
    }

    function clearMapSel() {
        mapTowns.clear();
        mapLabel = '';
        if (mapDrawn) paintMap();
        applyFilters();
    }

    function mapWhere() {
        if (mapLabel) return mapLabel;
        const t = [...mapTowns];
        if (!t.length) return '';
        return t.length <= 3 ? t.join(', ') : `${t.length} towns`;
    }

    function renderMapSelBar() {
        const bar = document.getElementById('mapSelBar');
        if (!bar) return;
        if (!mapTowns.size) { bar.style.display = 'none'; return; }
        document.getElementById('mapSelText').textContent =
            `Map selection: ${mapWhere()} — ${mapTowns.size} town${mapTowns.size === 1 ? '' : 's'}.`;
        bar.style.display = 'flex';
    }

    function hotRegion(name) {
        document.querySelectorAll('#mapStage .twn.hot').forEach(el => el.classList.remove('hot'));
        if (mapMode !== 'regions') return;
        const rgn = townRegion[name];
        if (!rgn) return;
        const set = new Set(REGIONS[rgn].towns);
        document.querySelectorAll('#mapStage .twn').forEach(el => {
            if (set.has(el.dataset.town)) el.classList.add('hot');
        });
    }

    function showTip(e, name) {
        const n = townCount(name);
        const rgn = townRegion[name] || 'unassigned';
        const tip = document.getElementById('mapTip');
        if (mapMode === 'regions' && REGIONS[rgn]) {
            const tot = REGIONS[rgn].towns.reduce((a,t) => a + townCount(t), 0);
            tip.innerHTML = `<b>${esc(rgn)}</b><span class="tip-n">${tot} referee${tot === 1 ? '' : 's'}</span>` +
                            `<span class="tip-r"> · ${REGIONS[rgn].towns.length} towns · ${esc(name)} has ${n}</span>`;
        } else {
            tip.innerHTML = `<b>${esc(name)}</b><span class="tip-n">${n} referee${n === 1 ? '' : 's'}</span>` +
                            `<span class="tip-r"> · ${esc(rgn)}</span>`;
        }
        tip.style.display = 'block';
        const pad = 16;
        let x = e.clientX + pad, y = e.clientY + pad;
        if (x + tip.offsetWidth  > window.innerWidth  - 8) x = e.clientX - tip.offsetWidth  - pad;
        if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - pad;
        tip.style.left = x + 'px';
        tip.style.top  = y + 'px';
    }
    function hideTip() {
        document.getElementById('mapTip').style.display = 'none';
        document.querySelectorAll('#mapStage .twn.hot').forEach(el => el.classList.remove('hot'));
    }

    // ── What the map could NOT place — reported, never hidden ─────────────────
    function reportUnmatched() {
        const bad = {}, blank = [];
        REFS.forEach(r => {
            const c = (r.city || '').trim();
            if (!c) { blank.push({ id: r.id, name: r.name, email: r.email, zip: r['Zip Code'] }); return; }
            if (!resolveTown(c)) bad[c] = (bad[c] || 0) + 1;
        });
        const list = Object.entries(bad).sort((a,b) => b[1] - a[1]);
        const total = list.reduce((a, [,n]) => a + n, 0);
        const guesses = Object.entries(FUZZY);
        let html = '';

        if (total) html +=
            `<p class="map-note warn">⚠ ${total} referee${total===1?'':'s'} in ${list.length}
             unrecognized ${list.length===1?'place':'places'} ${total===1?"isn't":"aren't"} on the map —
             ${esc(list.slice(0, 12).map(([c,n]) => `${c} (${n})`).join(', '))}${list.length>12?'…':''}</p>`;
        if (blank.length) html +=
            `<p class="map-note warn">⚠ ${blank.length} referees have a blank town and can't be
             placed. The availability form now requires a zip, so this heals as they come through —
             full list is in the browser console.</p>`;
        if (guesses.length) html +=
            `<p class="map-note info">ℹ Best-guess matches (one character off):
             ${esc(guesses.map(([raw, t]) => `${raw} → ${t}`).join(', '))}. Fix the source record if any are wrong.</p>`;

        document.getElementById('mapWarnings').innerHTML = html;
        if (blank.length) console.table(blank);
    }

    // ── Tray ─────────────────────────────────────────────────────────────────
    function trayWhereText() {
        const parts = [];
        const mw = mapWhere();
        if (mw) parts.push(mw);
        const poolId = document.getElementById('fPool').value;
        if (poolId) {
            const p = POOLS.find(x => x.id === Number(poolId));
            if (p) parts.push(`pool “${p.name}”`);
        }
        const town = document.getElementById('fTown').value;
        if (town && !mw) parts.push(town);
        return parts.length ? parts.join(' + ') : 'the whole directory';
    }

    function renderTray() {
        const tray = document.getElementById('tray');
        if (!tray) return;
        const n = lastFiltered.length;
        // Only surface the tray once the set is actually narrowed — showing it for
        // all 578 refs would just be a bar that never goes away.
        const narrowed = mapTowns.size > 0
            || !!document.getElementById('fPool').value
            || !!document.getElementById('fTown').value
            || !!document.getElementById('fSearch').value.trim();
        tray.classList.toggle('on', narrowed && n > 0);
        document.getElementById('trayCount').textContent = n;
        document.getElementById('trayWhere').textContent = trayWhereText();
    }

    let _flashT = null;
    function trayFlash(msg) {
        const el = document.getElementById('trayMsg');
        el.textContent = msg;
        clearTimeout(_flashT);
        _flashT = setTimeout(() => { el.textContent = ''; }, 3500);
    }

    function trayCopyEmails() {
        const list = lastFiltered.map(r => r.email).filter(Boolean);
        navigator.clipboard.writeText(list.join(', '))
            .then(() => trayFlash(`${list.length} email${list.length === 1 ? '' : 's'} copied`))
            .catch(() => trayFlash('Copy failed'));
    }

    function trayAddToPool() {
        const p = activePool();
        if (!p) { trayFlash('Set a pool active first'); return; }
        addAllShownToActive();
    }

    // ═════════════════════════════════════════════════════════════════════════
    //  COMPOSE — front end only.
    //  Everything here works today except the actual send. The Send button stays
    //  disabled until Mailgun DKIM is verified AND there is a Supabase Edge
    //  Function to hold the API key (it can never sit in this file — public repo).
    //  Copy BCC List is the interim: paste into Gmail and send by hand.
    // ═════════════════════════════════════════════════════════════════════════

    let cmpDropped = new Set();   // refs pulled out inside the composer
    let cmpChannel = 'email';

    function composeRecipients() {
        return lastFiltered.filter(r => !cmpDropped.has(r.id));
    }
    const hasEmail  = r => !!(r.email && String(r.email).trim());
    const optedOut  = r => r.email_opt_in === false;
    const sendable  = r => hasEmail(r) && !optedOut(r);

    function openCompose() {
        if (!lastFiltered.length) { trayFlash('Nothing selected to email'); return; }
        cmpDropped.clear();
        document.getElementById('cmpBack').classList.add('on');
        document.body.style.overflow = 'hidden';
        renderCompose();
    }

    function closeCompose() {
        document.getElementById('cmpBack').classList.remove('on');
        document.body.style.overflow = '';
    }

    function setChannel(c) {
        cmpChannel = c;
        document.getElementById('chanEmail').classList.toggle('on', c === 'email');
        renderCompose();
    }

    function renderCompose() {
        const all  = composeRecipients();
        const good = all.filter(sendable);
        const noEm = all.filter(r => !hasEmail(r));
        const out  = all.filter(r => hasEmail(r) && optedOut(r));
        const minors = good.filter(isMinor);

        document.getElementById('cmpTo').textContent =
            `${good.length} referee${good.length === 1 ? '' : 's'} · ${trayWhereText()}`;

        document.getElementById('cmpStats').innerHTML = `
            <div class="cmp-stat"><div class="n">${good.length}</div><div class="k">will receive</div></div>
            <div class="cmp-stat${noEm.length ? ' bad' : ''}"><div class="n">${noEm.length}</div><div class="k">no email</div></div>
            <div class="cmp-stat${out.length ? ' bad' : ''}"><div class="n">${out.length}</div><div class="k">opted out</div></div>
            <div class="cmp-stat"><div class="n">${minors.length}</div><div class="k">minors</div></div>`;

        let warn = '';
        if (noEm.length) warn += `<div class="cmp-warn">⚠ ${noEm.length} of these referees have no email address on file — they're shown in red below and will be skipped.</div>`;
        if (out.length)  warn += `<div class="cmp-warn">⚠ ${out.length} have opted out of email. They are excluded and cannot be re-added here.</div>`;
        if (minors.length) warn += `<div class="cmp-warn">ℹ ${minors.length} recipient${minors.length === 1 ? ' is a minor' : 's are minors'}. Fine for email. When texting is built, minors need guardian consent first.</div>`;
        document.getElementById('cmpWarn').innerHTML = warn;

        document.getElementById('cmpRecipients').innerHTML = all.length
            ? all.map(r => {
                const bad = !sendable(r);
                const why = !hasEmail(r) ? 'no email' : (optedOut(r) ? 'opted out' : '');
                return `<span class="rcp${bad ? ' no' : ''}" title="${esc(r.email || 'no email on file')}">
                          ${esc(r.name || '—')}${why ? ` <em style="font-style:normal;opacity:.75;">(${why})</em>` : ''}
                          <span class="rx" onclick="dropRecipient(${r.id})">✕</span>
                        </span>`;
              }).join('')
            : '<span class="muted-dash">Everyone has been removed.</span>';

        document.getElementById('cmpBlocked').innerHTML =
            `<b>Sending isn't wired up yet.</b> The Mailgun key has to live server-side in a
             Supabase Edge Function — it can't sit in this page, the repo is public. Two things
             are outstanding: your DKIM record verified in GoDaddy, and confirmation you can
             deploy an Edge Function. Until then, <b>Copy BCC List</b> puts all
             ${good.length} address${good.length === 1 ? '' : 'es'} on your clipboard to paste into Gmail.`;

        document.getElementById('cmpSend').disabled = true;
        document.getElementById('cmpSend').title = 'Blocked on Mailgun DKIM + Edge Function';
        renderPreview();
    }

    function dropRecipient(id) { cmpDropped.add(id); renderCompose(); }

    function insertToken(tok) {
        const ta = document.getElementById('cmpBody');
        const s = ta.selectionStart ?? ta.value.length;
        const e = ta.selectionEnd ?? ta.value.length;
        ta.value = ta.value.slice(0, s) + tok + ta.value.slice(e);
        ta.focus();
        ta.selectionStart = ta.selectionEnd = s + tok.length;
        renderPreview();
    }

    function mergeFor(r, text) {
        const full  = (r.name || '').trim();
        const first = full.split(/\s+/)[0] || 'there';
        return String(text)
            .replace(/\{\{\s*first\s*\}\}/gi, first)
            .replace(/\{\{\s*name\s*\}\}/gi, full || 'there')
            .replace(/\{\{\s*town\s*\}\}/gi, resolveTown(r.city) || r.city || 'your area');
    }

    function renderPreview() {
        const good = composeRecipients().filter(sendable);
        const sub  = document.getElementById('cmpSubject').value;
        const body = document.getElementById('cmpBody').value;
        const el   = document.getElementById('cmpPreview');
        if (!good.length) { el.innerHTML = '<span class="muted-dash">No sendable recipients.</span>'; return; }
        const r = good[0];
        el.innerHTML =
            `<span class="pto">To: ${esc(r.name)} &lt;${esc(r.email)}&gt;</span>` +
            `<span class="psub">${esc(mergeFor(r, sub)) || '<em style="color:#9ca3af;">(no subject)</em>'}</span>` +
            (body ? esc(mergeFor(r, body)) : '<span style="color:#9ca3af;">Start typing your message…</span>');
    }

    function cmpFlash(msg) {
        const el = document.getElementById('cmpMsg');
        el.textContent = msg;
        setTimeout(() => { el.textContent = ''; }, 3500);
    }

    function copyBcc() {
        const list = composeRecipients().filter(sendable).map(r => r.email);
        if (!list.length) { cmpFlash('No sendable addresses'); return; }
        navigator.clipboard.writeText(list.join(', '))
            .then(() => cmpFlash(`${list.length} addresses copied — paste into BCC`))
            .catch(() => cmpFlash('Copy failed'));
    }

    function copyBody() {
        const sub  = document.getElementById('cmpSubject').value;
        const body = document.getElementById('cmpBody').value;
        // Merge tokens can't survive a single copy-paste to many people —
        // hand over the generic version and say so.
        const txt = `Subject: ${sub}\n\n${body}`;
        navigator.clipboard.writeText(txt)
            .then(() => cmpFlash('Message copied (merge tokens left as-is)'))
            .catch(() => cmpFlash('Copy failed'));
    }

    document.getElementById('cmpBack').addEventListener('click', e => {
        if (e.target.id === 'cmpBack') closeCompose();
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('cmpBack').classList.contains('on')) closeCompose();
    });
</script>
</body>
</html>
