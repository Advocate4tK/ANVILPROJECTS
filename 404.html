<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found — Referee Tool</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { margin:0; background:#060e20; color:#fff;
         font-family:'DM Sans',system-ui,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { max-width:520px; padding:40px 28px; text-align:center; }
  h1 { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:800;
       font-size:2.6rem; letter-spacing:3px; text-transform:uppercase; margin:0 0 6px; }
  .sub { color:#00c853; font-weight:700; letter-spacing:2px;
         text-transform:uppercase; font-size:0.85rem; margin-bottom:22px; }
  p { color:rgba(255,255,255,0.72); line-height:1.6; font-size:0.95rem; }
  code { background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:4px;
         font-family:'JetBrains Mono',monospace; font-size:0.85rem;
         word-break:break-all; color:#fff; }
  a.btn { display:inline-block; margin-top:22px; background:#00c853; color:#062;
          font-weight:800; letter-spacing:1px; text-transform:uppercase;
          text-decoration:none; padding:11px 22px; border-radius:8px; font-size:0.85rem; }
  #checking { color:rgba(255,255,255,0.5); font-size:0.85rem; }
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <div class="sub">Page not found</div>
  <p id="checking">Checking for a match…</p>
  <div id="msg" hidden>
    <p>Nothing lives at <code id="what"></code>.</p>
    <p>Web addresses here are <strong>case-sensitive</strong> — <code>/neconn/</code>
       and <code>/NECONN/</code> are different addresses.</p>
    <a class="btn" href="/">Go to Referee Tool</a>
  </div>
</div>

<script>
/* Case-forgiving redirect.
   GitHub Pages serves this file for any path it cannot find, and its URLs are
   case-sensitive — /NECONN/master_schedule/ is a different address from
   /neconn/master_schedule/ and 404s. Typing a club name in caps is a completely
   reasonable thing for a human to do, so try the lowercase form.

   It VERIFIES before redirecting rather than bouncing blind. Some real paths on
   this site are legitimately uppercase — /PICS/, /TOURNAMENT/, /BACKUPS/ — so a
   blanket lowercase would send people somewhere that does not exist and turn one
   dead end into two. A HEAD request costs nothing and removes the guess.

   Cannot loop: the redirect only fires when the lowered path DIFFERS from the
   current one, so the destination can never bounce again. */
(function () {
  var path = window.location.pathname;
  var lower = path.toLowerCase();
  var show = function () {
    document.getElementById('checking').hidden = true;
    document.getElementById('what').textContent = path;
    document.getElementById('msg').hidden = false;
  };

  if (lower === path) { show(); return; }

  fetch(lower, { method: 'HEAD' })
    .then(function (r) {
      if (r.ok) {
        window.location.replace(lower + window.location.search + window.location.hash);
      } else { show(); }
    })
    .catch(show);
})();
</script>
</body>
</html>
