<!DOCTYPE html>
<html lang="en">
<!-- All-in-one public schedule: NECONN, Plainfield and Canterbury on one page.

     This page MANAGES NOTHING. Each club still owns and uploads its own games
     under its own "Source Club" exactly as before — this is a second window onto
     the same rows, sharing /schedules/club.js with every single-club page so a
     fix lands everywhere at once.

     Add a club by adding a tab below and to MASTER's list. Nothing else. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NECONN League — Schedule</title>
<meta name="description" content="Game schedule for NECONN, Plainfield and Canterbury — updated automatically as changes are approved.">
<link rel="canonical" href="https://referee-tool.com/league/schedule">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/schedules/club.css?v=2">
</head>
<body>
<div id="clubSchedule"></div>
<script>
// The strings here must resolve against clubs.name or clubs."Club Name" — the
// page fails loudly with the offending name rather than rendering a convincing
// empty tab.
window.LEAGUE_TITLE = "NECONN League";
window.LEAGUE_TABS = [
    { label: "Master",     title: "NECONN League",                 clubs: ["NECONN", "Plainfield Youth Soccer", "Canterbury Athletic Association"] },
    { label: "NECONN",     title: "NECONN",                        clubs: ["NECONN"] },
    { label: "Plainfield", title: "Plainfield Youth Soccer",       clubs: ["Plainfield Youth Soccer"] },
    { label: "Canterbury", title: "Canterbury Athletic Association", clubs: ["Canterbury Athletic Association"] }
];
</script>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js?v=14"></script>
<script src="/schedules/club.js?v=2"></script>
</body>
</html>
