<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Unsubscribe — Referee Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #060e20 !important;
            background-image: repeating-linear-gradient(
                15deg, transparent, transparent 56px,
                rgba(255,255,255,0.016) 56px, rgba(255,255,255,0.016) 58px
            ) !important;
        }

        /* ── Logo mark ── */
        .logo-mark { --sz: 65px; position: relative; width: var(--sz); height: var(--sz); flex-shrink: 0; margin: 0 auto 20px; }
        .lcard { position: absolute; border-radius: calc(var(--sz) * 0.065); }
        .lcard-red {
            width: calc(var(--sz)*0.58); height: calc(var(--sz)*0.82);
            background: linear-gradient(145deg,#f87171 0%,#ef4444 55%,#b91c1c 100%);
            box-shadow: 0 calc(var(--sz)*0.02) calc(var(--sz)*0.12) rgba(239,68,68,0.45);
            top: calc(var(--sz)*0.21); left: calc(var(--sz)*0.32); transform: rotate(22deg);
        }
        .lcard-yellow {
            width: calc(var(--sz)*0.64); height: calc(var(--sz)*0.88);
            background: linear-gradient(145deg,#fde047 0%,#f59e0b 55%,#b45309 100%);
            box-shadow: 0 0 calc(var(--sz)*0.2) rgba(245,158,11,0.6), 0 0 calc(var(--sz)*0.4) rgba(245,158,11,0.2), 0 calc(var(--sz)*0.05) calc(var(--sz)*0.18) rgba(0,0,0,0.5);
            top: calc(var(--sz)*0.12); left: calc(var(--sz)*0.18); transform: rotate(10deg);
        }
        .lcard-yellow::before {
            content:''; position:absolute; top:8%; left:10%; width:14%; height:52%;
            background:linear-gradient(180deg,rgba(255,255,255,0.38) 0%,rgba(255,255,255,0) 100%); border-radius:3px;
        }
        .logo-text {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; padding-top:calc(var(--sz)*0.10);
            font-family:'Barlow Condensed',sans-serif; font-weight:800;
            text-transform:uppercase; text-align:center; z-index:10; line-height:0.88; letter-spacing:2px;
        }
        .logo-line1 { color:#fff; font-size:calc(var(--sz)*0.2); text-shadow:0 2px 12px rgba(0,0,0,0.95),0 0 24px rgba(0,0,0,0.7); }
        .logo-line2 { color:#00c853; font-size:calc(var(--sz)*0.32); text-shadow:0 2px 12px rgba(0,0,0,0.95),0 0 28px rgba(0,200,83,0.5); margin-top:calc(var(--sz)*-0.01); transform:skewX(-14deg); display:block; }
        .logo-underline { display:block; height:calc(var(--sz)*0.022); width:calc(var(--sz)*0.58); margin-top:calc(var(--sz)*0.025); background:#ef4444; border-radius:calc(var(--sz)*0.01); box-shadow:0 0 calc(var(--sz)*0.012) #ef4444,0 0 calc(var(--sz)*0.04) rgba(239,68,68,0.85),0 0 calc(var(--sz)*0.08) rgba(239,68,68,0.5); transform:skewX(-14deg); }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); padding: 36px 32px; max-width: 480px; width: 100%; }
        .status { text-align: center; padding: 10px 0; }
        .status .icon { font-size: 3rem; margin-bottom: 12px; }
        .status .msg { font-family: 'Barlow Condensed', sans-serif; font-size: 1.6rem; font-weight: 800; color: #09142a; margin-bottom: 8px; line-height: 1.15; }
        .status .sub { font-size: 0.9rem; color: #666; line-height: 1.6; }
        .btn { display: block; width: 100%; background: #dc2626; color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 22px; transition: background 0.15s; }
        .btn:hover { background: #b91c1c; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .fine { font-size: 0.78rem; color: #999; margin-top: 18px; line-height: 1.5; text-align: center; }
        .fine a { color: #1a3a6b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-mark">
            <div class="lcard lcard-red"></div>
            <div class="lcard lcard-yellow"></div>
            <div class="logo-text">
                <span class="logo-line1">Referee</span>
                <span class="logo-line2">Tool</span>
                <span class="logo-underline"></span>
            </div>
        </div>
        <div id="content"><p style="color:#888; text-align:center; padding:30px 0;">Loading…</p></div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    // ═══════════════════════════════════════════════════════════════════════
    // Unsubscribe from Referee Blasts
    //
    // The link in every blast footer lands here with ?t=<unsubscribe_token>.
    // The person opening it is NOT logged in, and the referees table is
    // RLS-protected, so this page cannot write to it. It calls
    // unsubscribe_by_token() instead — a SECURITY DEFINER function that flips
    // email_opt_in on the one row whose token matches, and nothing else.
    //
    // Two-step on purpose: show who it is and a button, THEN flip. A link
    // that unsubscribes on open gets triggered by mail scanners and link
    // previews, and people find themselves opted out having clicked nothing.
    // ═══════════════════════════════════════════════════════════════════════
    const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    const token = new URLSearchParams(location.search).get('t') || '';
    const el    = document.getElementById('content');

    function show(icon, msg, sub, btn) {
        el.innerHTML = `<div class="status"><div class="icon">${icon}</div><div class="msg">${msg}</div><div class="sub">${sub}</div></div>${btn || ''}`;
    }

    if (!UUID.test(token)) {
        show('⚠️', 'That link isn\'t valid', 'It may have been cut off when it was copied. Open the email again and click the unsubscribe link directly.');
    } else {
        show('✉️', 'Stop receiving referee emails?',
             'You\'ll no longer get blasts about openings, schedules, or announcements from Referee Tool assignors.<br><br>This does not affect game assignments or your registration — only the group emails.',
             `<button class="btn" id="go">Yes, unsubscribe me</button>
              <div class="fine">Changed your mind later? Any assignor can turn email back on for you.</div>`);

        document.getElementById('go').addEventListener('click', async () => {
            const btn = document.getElementById('go');
            btn.disabled = true; btn.textContent = 'One moment…';
            try {
                const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                const { data, error } = await sb.rpc('unsubscribe_by_token', { p_token: token });
                if (error) throw error;
                if (data === true) {
                    show('✅', 'You\'re unsubscribed', 'You won\'t receive any more group emails from Referee Tool. Sorry to see you go.');
                } else {
                    show('⚠️', 'That link isn\'t valid', 'It doesn\'t match anyone on our list. If you\'re still getting emails, reply to one and tell the assignor directly.');
                }
            } catch (e) {
                console.error(e);
                show('⚠️', 'Something went wrong', 'We couldn\'t process that just now. Try again in a minute, or reply to the email and ask to be removed.');
            }
        });
    }
    </script>
</body>
</html>
